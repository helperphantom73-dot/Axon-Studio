          import 'package:material_ui/material_ui.dart';
          import 'package:qr/qr.dart';

          class GlassCard extends StatelessWidget {
            final Widget child; final EdgeInsetsGeometry padding; final Color? borderColor; final VoidCallback? onTap;
            const GlassCard({super.key, required this.child, this.padding = const EdgeInsets.all(16), this.borderColor, this.onTap});
            @override
            Widget build(BuildContext context) {
              final box = AnimatedContainer(
                duration: const Duration(milliseconds: 220), padding: padding,
                decoration: BoxDecoration(
                  color: const Color(0xFF121722), borderRadius: BorderRadius.circular(18),
                  border: Border.all(color: borderColor ?? Colors.white.withValues(alpha: 0.08)),
                ),
                child: child,
              );
              return onTap == null ? box : Material(color: Colors.transparent, child: InkWell(onTap: onTap, borderRadius: BorderRadius.circular(18), child: box));
            }
          }

          class BenchBarChart extends StatelessWidget {
            final double cpuMs, gpuMs, cpuGflops, gpuGflops;
            const BenchBarChart({super.key, required this.cpuMs, required this.gpuMs, required this.cpuGflops, required this.gpuGflops});
            @override
            Widget build(BuildContext context) {
              return TweenAnimationBuilder<double>(
                tween: Tween(begin: 0, end: 1), duration: const Duration(milliseconds: 650), curve: Curves.easeOutCubic,
                builder: (_, p, __) => SizedBox(height: 155, width: double.infinity, child: CustomPaint(painter: _BP(cpuGflops * p, gpuGflops * p, cpuMs, gpuMs))),
              );
            }
          }

          class _BP extends CustomPainter {
            final double cg, gg, cm, gm;
            _BP(this.cg, this.gg, this.cm, this.gm);
            @override
            void paint(Canvas canvas, Size s) {
              final mx = (cg > gg ? cg : gg).clamp(1.0, double.infinity);
              void bar(double y, String lbl, double g, double ms, List<Color> cols) {
                (TextPainter(text: TextSpan(text: '$lbl  ${g.toStringAsFixed(1)} GFLOP/s (${ms.toStringAsFixed(2)} ms)', style: const TextStyle(color: Color(0xFFB8C4D9), fontSize: 12)), textDirection: TextDirection.ltr)..layout()).paint(canvas, Offset(0, y));
                final tr = RRect.fromRectAndRadius(Rect.fromLTWH(0, y + 20, s.width, 32), const Radius.circular(9));
                canvas.drawRRect(tr, Paint()..color = Colors.white.withValues(alpha: 0.05));
                final w = (g / mx) * s.width;
                if (w > 2) {
                  final fr = RRect.fromRectAndRadius(Rect.fromLTWH(0, y + 20, w, 32), const Radius.circular(9));
                  canvas.drawRRect(fr, Paint()..shader = LinearGradient(colors: cols).createShader(fr.outerRect));
                }
              }
              bar(4, 'CPU SIMD', cg, cm, const [Color(0xFF7C4DFF), Color(0xFF536DFE)]);
              bar(80, 'OpenCL GPU', gg, gm, const [Color(0xFF00E5FF), Color(0xFF1DE9B6)]);
            }
            @override bool shouldRepaint(covariant _BP o) => o.cg != cg || o.gg != gg;
          }

          class OfflineQrCode extends StatelessWidget {
            final String data; final double size;
            const OfflineQrCode({super.key, required this.data, this.size = 150});
            @override
            Widget build(BuildContext context) {
              final qr = QrImage(QrCode(payload: QrPayload.fromString(data), errorCorrectLevel: QrErrorCorrectLevel.medium));
              return Container(width: size, height: size, padding: const EdgeInsets.all(10), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(14)), child: CustomPaint(painter: _QP(qr)));
            }
          }

          class _QP extends CustomPainter {
            final QrImage qr; _QP(this.qr);
            @override void paint(Canvas c, Size s) {
              final n = qr.moduleCount; final cell = s.width / n; final p = Paint()..color = const Color(0xFF090B10);
              for (var y = 0; y < n; y++) {
                for (var x = 0; x < n; x++) {
                  if (qr.isDark(y, x)) { c.drawRect(Rect.fromLTWH(x * cell, y * cell, cell + 0.3, cell + 0.3), p); }
                }
              }
            }
            @override bool shouldRepaint(covariant _QP o) => false;
          }
          """)


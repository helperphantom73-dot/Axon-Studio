              final dl = await _bridge.saveToDownloads(srcPath: outPath, subDir: subDir, fileName: 'AxonStudio-$slug-ios-unsigned.ipa', mimeType: 'application/octet-stream');
              log('✓ بسته iOS (.ipa) ساخته شد:\n  $dl');
              return ExportedFileInfo(label: 'اشتراک iOS (.ipa)', internalPath: outPath, downloadsPath: dl, mimeType: 'application/octet-stream');
            }
          }

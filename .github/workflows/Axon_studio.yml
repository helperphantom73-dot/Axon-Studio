          }
          JNIEXPORT void JNICALL Java_com_axon_AxonBridge_resetKvCache(JNIEnv *e, jobject t){
              (void)e;(void)t; if(p_kvreset&&g_kv) p_kvreset(g_kv); g_kvu=0;
          }
          JNIEXPORT jstring JNICALL Java_com_axon_AxonBridge_getStatus(JNIEnv *e, jobject t){
              (void)t; resolve_syms();
              double saved=g_raw>0?(1.0-(double)g_act/(double)g_raw)*100.0:0.0;
              double flops=strcmp(g_mode,"brain")==0?64.5:(strcmp(g_mode,"ternary")==0?78.0:0.0);
              char j[1024];
              snprintf(j,sizeof(j),
                  "{\"edition\":\"%s\",\"is_server\":false,\"quota_used_s\":%llu,\"quota_locked\":%s,"
                  "\"model\":\"%s\",\"format\":\"axg1+axn3\",\"mode\":\"%s\",\"raw_bytes\":%llu,"
                  "\"active_bytes\":%llu,\"ram_saved\":%.2f,\"flops_skipped\":%.2f,\"last_ms\":%.2f,"
                  "\"opencl_device\":\"%s\",\"live_allocs\":%zu}",
                  g_q.edition[0]?g_q.edition:"mobile",(unsigned long long)g_q.quota_used_s,g_q.quota_locked?"true":"false",
                  g_model,g_mode,(unsigned long long)g_raw,(unsigned long long)g_act,saved,flops,g_ms,
                  p_fwd?"ARM64 Native libaxon_android.so":"Waiting for libaxon_android.so", p_allocs?p_allocs():0);
              return (*e)->NewStringUTF(e, j);
          }
          JNIEXPORT jstring JNICALL Java_com_axon_AxonBridge_runChat(JNIEnv *e, jobject t, jstring prP, jint maxT, jfloat tmp){
              (void)t;(void)tmp; resolve_syms();
              if(!axon_quota_tick(&g_q,1)) return (*e)->NewStringUTF(e,"{\"reply\":\"QUOTA_LOCKED\",\"quota_locked\":true}");
              const char *pr=(*e)->GetStringUTFChars(e,prP,0); double t0=ms_now(); char out[4096]={0}; int gen=0;
              if(p_fwd && g_weights){ gen=p_fwd(g_arena,g_weights,g_nodes,g_hdr.node_count,g_kv,g_mode,pr,(int)maxT,out,sizeof(out)); g_kvu+=gen; }
              else snprintf(out,sizeof(out),"Load .axg1/.axn3 model and libaxon_android.so first.");
              double dt=ms_now()-t0; g_ms=dt; double tps=dt>0.01?((double)gen/(dt/1000.0)):0.0;
              (*e)->ReleaseStringUTFChars(e,prP,pr);
              char j[4608]; snprintf(j,sizeof(j),"{\"reply\":\"%s\",\"ms\":%.2f,\"tok_per_sec\":%.2f,\"tokens\":%d,\"kv_used\":%d,\"kv_max\":%u,\"quota_locked\":false}",
                  out,dt,tps,gen,g_kvu,g_hdr.max_seq_len?g_hdr.max_seq_len:4096);
              return (*e)->NewStringUTF(e,j);
          }
          JNIEXPORT jstring JNICALL Java_com_axon_AxonBridge_runBench(JNIEnv *e, jobject t){
              (void)t; resolve_syms(); const int N=256;
              float *A=(float*)calloc(N*N,4), *B=(float*)calloc(N*N,4), *C=(float*)calloc(N*N,4);
              double t0=ms_now(); if(p_mm) p_mm(A,B,C,N,N,N); double ms=ms_now()-t0; if(ms<0.01) ms=0.01;

              if (await stage.exists()) { await stage.delete(recursive: true); }
              await stage.create(recursive: true);
              if (await _bridge.extractAsset('assets/templates/linux-enduser.tar.gz', tplTgz.path)) {
                await _extractTarGz(tplTgz, stage);
                await tplTgz.delete();
                log('✓ محیط کاربری گرافیکی End-User لینوکس اضافه شد.');
              }
              await _stageData(stage, req, licJson);
              if (req.linuxBinary != null && await req.linuxBinary!.exists()) {
                await req.linuxBinary!.copy('${stage.path}/bin/${req.linuxBinary!.uri.pathSegments.last}');
              }
              await File('${stage.path}/start-server.sh').writeAsString(
                '#!/usr/bin/env bash\nDIR="\$(cd "\$(dirname "\$0")" && pwd)"\n'
                'exec "\$DIR/bin/axon-studio" ${cfg.bundledAxg.isNotEmpty ? "--axg \"\$DIR/models/${cfg.bundledAxg}\" " : ""}'
                '${cfg.bundledAxn.isNotEmpty ? "--axn \"\$DIR/models/${cfg.bundledAxn}\" " : ""}--mode ${cfg.allowedModes.first} --serve --host 0.0.0.0 --port \${PORT:-8080}\n',
              );
              final arch = createArchiveFromDirectory(stage, includeDirName: false);
              for (final f in arch.files) {
                if (f.name == 'axon_studio_app' || f.name == 'start-server.sh' || f.name.startsWith('bin/')) { f.mode = 493; }
              }
              final gzBytes = GZipEncoder().encode(TarEncoder().encode(arch));
              final srvOut = File('${req.workDir.path}/axon-server-$slug-linux-x64.tar.gz');
              await srvOut.writeAsBytes(gzBytes);
              final dlSrv = await _bridge.saveToDownloads(srcPath: srvOut.path, subDir: subDir, fileName: 'axon-server-$slug-linux-x64.tar.gz', mimeType: 'application/gzip');
              res.add(ExportedFileInfo(label: 'اشتراک Linux Server (.tar.gz)', internalPath: srvOut.path, downloadsPath: dlSrv, mimeType: 'application/gzip'));

              final binOut = File('${req.workDir.path}/AxonStudio-$slug-x86_64.bin');
              final hdr = '#!/usr/bin/env bash\nset -e\nCACHE="\${XDG_CACHE_HOME:-\$HOME/.cache}/axon-$slug"\nrm -rf "\$CACHE" && mkdir -p "\$CACHE"\n'
                  'L=\$(awk "/^__AXON_BIN__/ {print NR+1; exit 0;}" "\$0")\ntail -n +"\$L" "\$0" | tar -xz -C "\$CACHE"\nchmod +x "\$CACHE/axon_studio_app" "\$CACHE/start-server.sh" "\$CACHE/bin/"* 2>/dev/null || true\n'
                  'if [ "\${1:-}" = "--serve" ]; then shift; exec "\$CACHE/start-server.sh" "\$@"; fi\nexec "\$CACHE/axon_studio_app" "\$@"\nexit 0\n__AXON_BIN__\n';
              final sink = binOut.openWrite();
              sink.add(utf8.encode(hdr)); sink.add(gzBytes); await sink.close();
              final dlBin = await _bridge.saveToDownloads(srcPath: binOut.path, subDir: subDir, fileName: 'AxonStudio-$slug-x86_64.bin', mimeType: 'application/octet-stream');
              res.add(ExportedFileInfo(label: 'اشتراک Linux GUI (.bin)', internalPath: binOut.path, downloadsPath: dlBin, mimeType: 'application/octet-stream'));
              log('✓ خروجی خوداجرای لینوکس (.bin) و سرور (.tar.gz) ساخته شد:\n  $dlBin');
              await stage.delete(recursive: true);
              return res;
            }

            Future<ExportedFileInfo?> _mac(BuildAssetsRequest req, LicenseConfig cfg, String licJson, String slug, String subDir, void Function(String) log) async {
              final tplTgz = File('${req.workDir.path}/_tpl_mac.tar.gz');
              final stage = Directory('${req.workDir.path}/_stage_mac_$slug');
              if (await stage.exists()) { await stage.delete(recursive: true); }
              await stage.create(recursive: true);
              if (!await _bridge.extractAsset('assets/templates/macos-enduser.tar.gz', tplTgz.path)) {
                log('⚠ تمپلیت macOS یافت نشد.');
                return null;
              }
              await _extractTarGz(tplTgz, stage);
              await tplTgz.delete();
              final appDir = stage.listSync().whereType<Directory>().where((d) => d.path.endsWith('.app')).firstOrNull ?? Directory('${stage.path}/AxonStudio.app');
              final resDir = Directory('${appDir.path}/Contents/Resources');
              await _stageData(resDir, req, licJson);
              if (req.macBinary != null && await req.macBinary!.exists()) {
                await req.macBinary!.copy('${resDir.path}/bin/${req.macBinary!.uri.pathSegments.last}');
              }
              final arch = createArchiveFromDirectory(stage, includeDirName: false);
              for (final f in arch.files) {
                if (f.name.contains('/Contents/MacOS/') || f.name.contains('/Contents/Resources/bin/')) { f.mode = 493; }
              }
              final out = File('${req.workDir.path}/AxonStudio-$slug-macOS-app.tar.gz');
              await out.writeAsBytes(GZipEncoder().encode(TarEncoder().encode(arch)));
              final dl = await _bridge.saveToDownloads(srcPath: out.path, subDir: subDir, fileName: 'AxonStudio-$slug-macOS-app.tar.gz', mimeType: 'application/gzip');
              await stage.delete(recursive: true);
              log('✓ بسته macOS (.app) ساخته شد:\n  $dl');
              return ExportedFileInfo(label: 'اشتراک macOS (.app.tar.gz)', internalPath: out.path, downloadsPath: dl, mimeType: 'application/gzip');
            }

            Future<ExportedFileInfo?> _ios(BuildAssetsRequest req, LicenseConfig cfg, String licJson, String slug, String subDir, void Function(String) log) async {
              final modelPaths = [req.axgFile?.path, req.axnFile?.path, req.safetensorsFile?.path].whereType<String>().toList();
              final outPath = '${req.workDir.path}/AxonStudio-$slug-ios-unsigned.ipa';

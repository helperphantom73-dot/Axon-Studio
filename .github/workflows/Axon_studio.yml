                  ),
                  (l) { if (mounted) { setState(() => _logs.add(l)); } },
                );
                if (mounted) { setState(() => _exported = files); }
              } catch (e) {
                if (mounted) { setState(() => _logs.add('❌ خطا: $e')); }
              } finally {
                if (mounted) { setState(() => _busy = false); }
              }
            }


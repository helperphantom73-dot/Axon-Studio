                const SizedBox(height: 12),
                GlassCard(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  const Text('۲. نام برند، ساعت مجاز و محدودیت‌ها', style: TextStyle(fontWeight: FontWeight.bold)),
                  const SizedBox(height: 10),
                  Row(children: [
                    Expanded(child: TextField(controller: _brand, decoration: const InputDecoration(labelText: 'نام برند خروجی', border: OutlineInputBorder()))),
                    const SizedBox(width: 10),
                    DropdownButton<String>(value: _edition, items: const [DropdownMenuItem(value: 'standard', child: Text('Standard')), DropdownMenuItem(value: 'pro', child: Text('Pro'))], onChanged: (v) => setState(() => _edition = v ?? 'pro')),

          class VaultService {
            List<VaultAsset> items = [];

            Directory get vaultDir => Directory('${AppPaths.appDataDir().path}${Platform.pathSeparator}vault');
            File get _indexFile => File('${vaultDir.path}${Platform.pathSeparator}vault_index.json');

            Future<void> load() async {
              await vaultDir.create(recursive: true);
              if (!await _indexFile.exists()) { items = []; return; }
              try {
                final list = jsonDecode(await _indexFile.readAsString()) as List;
                items = list.map((e) => VaultAsset.fromJson(Map<String, dynamic>.from(e as Map))).toList();
                items.removeWhere((x) => !File(x.storedPath).existsSync());
              } catch (_) { items = []; }
            }

            Future<VaultAsset> importFile(File src) async {
              await vaultDir.create(recursive: true);
              final name = src.uri.pathSegments.where((e) => e.isNotEmpty).last;
              final low = name.toLowerCase();
              final cat = low.endsWith('.axg1') || low.endsWith('.axn3') || low.endsWith('.safetensors')
                  ? 'models'
                  : (low.endsWith('.so') || low.endsWith('.a') || low.endsWith('.dll') || low.endsWith('.dylib') ? 'mobile' : 'binaries');
              final sub = Directory('${vaultDir.path}${Platform.pathSeparator}$cat');
              await sub.create(recursive: true);
              final dst = File('${sub.path}${Platform.pathSeparator}$name');
              await src.copy(dst.path);
              if (!Platform.isWindows && cat == 'binaries') { await Process.run('chmod', ['+x', dst.path]); }

              items.removeWhere((i) => i.name == name && i.category == cat);
              final asset = VaultAsset(
                id: '${cat}_$name', name: name, category: cat,
                storedPath: dst.path, sizeBytes: await dst.length(), addedAt: DateTime.now(),
              );
              items.add(asset);
              await _save();
              return asset;
            }

            Future<void> deleteAsset(VaultAsset a) async {
              final f = File(a.storedPath);
              if (await f.exists()) { await f.delete(); }
              items.removeWhere((i) => i.id == a.id);
              await _save();
            }

            Future<void> _save() async {
              await vaultDir.create(recursive: true);
              await _indexFile.writeAsString(const JsonEncoder.withIndent('  ').convert(items.map((e) => e.toJson()).toList()), flush: true);
            }
          }
          """)


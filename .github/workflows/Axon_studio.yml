          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'dart:typed_data';
          import 'package:crypto/crypto.dart';
          import '../app_config.dart';
          import '../models/models.dart';

          class LicenseEvalResult {
            final LicenseConfig? config;
            final bool valid, quotaLocked;
            final int usedTotalS, usedWeeklyS;
            final String reason;
            const LicenseEvalResult({this.config, required this.valid, required this.quotaLocked, this.usedTotalS = 0, this.usedWeeklyS = 0, this.reason = ''});
          }

          class HmacLicenseService {
            static String generateNonce() {
              final r = Random.secure();
              return List.generate(16, (_) => r.nextInt(256).toRadixString(16).padLeft(2, '0')).join();
            }

            static String signPayload(String payload, {String? key}) =>
                Hmac(sha256, utf8.encode(key ?? AppConfig.hmacKey)).convert(utf8.encode(payload)).toString();

            static LicenseConfig signConfig(LicenseConfig cfg, {String? key}) =>
                cfg.withSignature(signPayload(cfg.canonicalPayload(), key: key));

            static bool verifyConfig(LicenseConfig cfg, {String? key}) {
              if (cfg.signature.length != 64) { return false; }
              return constantTimeEquals(cfg.signature, signPayload(cfg.canonicalPayload(), key: key));
            }

            static bool constantTimeEquals(String a, String b) {
              if (a.length != b.length) { return false; }
              var d = 0;
              for (var i = 0; i < a.length; i++) { d |= a.codeUnitAt(i) ^ b.codeUnitAt(i); }
              return d == 0;
            }

            static Uint8List pbkdf2(List<int> pass, List<int> salt, int iters, int len) {
              final hm = Hmac(sha256, pass); const hLen = 32; final l = (len + hLen - 1) ~/ hLen; final out = BytesBuilder();
              for (var i = 1; i <= l; i++) {
                final bi = Uint8List(salt.length + 4)..setRange(0, salt.length, salt)..[salt.length]=(i>>24)&0xff..[salt.length+1]=(i>>16)&0xff..[salt.length+2]=(i>>8)&0xff..[salt.length+3]=i&0xff;
                var u = Uint8List.fromList(hm.convert(bi).bytes); final t = Uint8List.fromList(u);
                for (var c = 1; c < iters; c++) { u = Uint8List.fromList(hm.convert(u).bytes); for (var j = 0; j < hLen; j++) { t[j] ^= u[j]; } }
                out.add(t);
              }
              return Uint8List.sublistView(out.takeBytes(), 0, len);
            }

            static Future<LicenseEvalResult> evaluateAndTick({
              required LicenseConfig? cfg, required File ledgerFile, required bool isServerActive, int deltaSeconds = 0,
            }) async {
              if (cfg == null) {
                if (AppConfig.isEndUserBuild) {
                  return const LicenseEvalResult(valid: false, quotaLocked: true, reason: 'فایل لایسنس امضاشده یافت نشد (Fail-Closed).');
                }
                return const LicenseEvalResult(valid: true, quotaLocked: false);
              }
              if (!verifyConfig(cfg)) {
                return LicenseEvalResult(config: cfg, valid: false, quotaLocked: true, reason: 'امضای HMAC-SHA256 نامعتبر است.');
              }
              if (cfg.scope == QuotaScope.unlimitedPro) { return LicenseEvalResult(config: cfg, valid: true, quotaLocked: false); }
              if (cfg.scope == QuotaScope.serverOnly && !isServerActive) { return LicenseEvalResult(config: cfg, valid: true, quotaLocked: false); }

              final now = DateTime.now().millisecondsSinceEpoch ~/ 1000;
              int tot = 0, wk = 0, wst = now, last = now;
              if (await ledgerFile.exists()) {
                final parts = (await ledgerFile.readAsString()).trim().split('|');
                if (parts.length != 6) { return LicenseEvalResult(config: cfg, valid: false, quotaLocked: true, reason: 'فایل Ledger دستکاری شده است.'); }
                final body = parts.sublist(0, 5).join('|');
                if (!constantTimeEquals(parts[5], signPayload(body)) || parts[0] != cfg.nonce) {
                  return LicenseEvalResult(config: cfg, valid: false, quotaLocked: true, reason: 'عدم تطابق امضای سهمیه.');
                }
                tot = int.tryParse(parts[1]) ?? 0; wk = int.tryParse(parts[2]) ?? 0;
                wst = int.tryParse(parts[3]) ?? now; last = int.tryParse(parts[4]) ?? now;
                if (now + 60 < last) {
                  return LicenseEvalResult(config: cfg, valid: false, quotaLocked: true, usedTotalS: tot, usedWeeklyS: wk, reason: 'برگشت ساعت سیستم تشخیص داده شد (Fail-Closed).');
                }
                if (now >= wst + 7 * 86400) { wst = now; wk = 0; }
              }
              if (cfg.expiresUnix > 0 && now > cfg.expiresUnix) {
                return LicenseEvalResult(config: cfg, valid: true, quotaLocked: true, usedTotalS: tot, usedWeeklyS: wk, reason: 'تاریخ انقضا به پایان رسیده است.');
              }
              tot += deltaSeconds; wk += deltaSeconds; last = now > last ? now : last;
              final body = '${cfg.nonce}|$tot|$wk|$wst|$last';
              await ledgerFile.parent.create(recursive: true);
              await ledgerFile.writeAsString('$body|${signPayload(body)}\n', flush: true);
              final locked = (cfg.maxTotalSeconds > 0 && tot >= cfg.maxTotalSeconds) || (cfg.maxWeeklySeconds > 0 && wk >= cfg.maxWeeklySeconds);
              return LicenseEvalResult(config: cfg, valid: true, quotaLocked: locked, usedTotalS: tot, usedWeeklyS: wk, reason: locked ? 'سقف ساعات مجاز مصرف شده است.' : '');
            }
          }
          """)


          class _AdmState extends State<AdminBuilderScreen> {
            final _brand = TextEditingController(text: 'Axon Studio Enterprise');
            final _wkH = TextEditingController(text: '40');
            final _totH = TextEditingController(text: '0');
            final _expD = TextEditingController(text: '0');
            String _edition = 'pro';
            QuotaScope _scope = QuotaScope.serverOnly;
            bool _lockModels = false, _busy = false;
            final Set<String> _modes = {'fp4', 'brain', 'ternary', 'f32', 'gpu'};
            final Set<BuildTarget> _targets = {BuildTarget.android, BuildTarget.windows, BuildTarget.linux};
            final List<String> _logs = [];
            List<ExportedFileInfo> _exported = [];

            @override void dispose() { _brand.dispose(); _wkH.dispose(); _totH.dispose(); _expD.dispose(); super.dispose(); }

            Future<void> _importToVault() async {
              final files = await FilePicker.pickFiles(type: FileType.any);
              for (final f in files) {
                if (f.path != null) { await widget.controller.vault.importFile(File(f.path!)); }
              }
              if (mounted) { setState(() {}); }
            }

            File? _vaultMatch(bool Function(String lowName) pred) {
              for (final a in widget.controller.vault.items) {
                if (pred(a.name.toLowerCase())) { return File(a.storedPath); }
              }
              return null;
            }

            Future<void> _export() async {
              setState(() { _busy = true; _logs.clear(); _exported = []; });
              final axg = _vaultMatch((n) => n.endsWith('.axg1'));
              final axn = _vaultMatch((n) => n.endsWith('.axn3'));
              final st = _vaultMatch((n) => n.endsWith('.safetensors'));
              final now = DateTime.now().millisecondsSinceEpoch ~/ 1000;
              final exp = int.tryParse(_expD.text) ?? 0;
              final cfg = LicenseConfig(
                brandName: _brand.text.trim().isEmpty ? 'Axon Studio' : _brand.text.trim(),
                edition: _edition, scope: _scope,
                maxTotalSeconds: (int.tryParse(_totH.text) ?? 0) * 3600,
                maxWeeklySeconds: (int.tryParse(_wkH.text) ?? 0) * 3600,
                expiresUnix: exp > 0 ? now + exp * 86400 : 0,
                lockModels: _lockModels, allowedModes: _modes.toList(),
                bundledAxg: axg?.uri.pathSegments.last ?? '', bundledAxn: axn?.uri.pathSegments.last ?? '',
                bundledSafetensors: st?.uri.pathSegments.last ?? '', issuedUnix: now, nonce: HmacLicenseService.generateNonce(),
              );
              final workDir = Directory('${AppPaths.appDataDir().path}${Platform.pathSeparator}exports');
              try {
                final files = await MultiTargetExporter().exportAll(
                  BuildAssetsRequest(
                    unsignedLicense: cfg, targets: _targets, workDir: workDir,
                    axgFile: axg, axnFile: axn, safetensorsFile: st,
                    linuxBinary: _vaultMatch((n) => n == 'axon-studio' || n == 'axon-pro-studio'),
                    windowsBinary: _vaultMatch((n) => n == 'axon-studio.exe' || n == 'axon-pro-studio.exe'),
                    macBinary: _vaultMatch((n) => n == 'axon-studio'),

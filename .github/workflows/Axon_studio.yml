          #include <jni.h>
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include "axon_quota_guard.h"

          #pragma pack(push, 1)
          typedef struct { char magic[4]; uint32_t ver, node_count, hidden_dim, vocab_size, num_layers, num_heads, max_seq_len; uint8_t res[28]; } Axg1Hdr;
          typedef struct { uint32_t op, layer; uint64_t off, bytes; uint32_t rows, cols, flags; uint8_t res[36]; } Axg1Node;
          #pragma pack(pop)

          typedef void* (*fn_arena)(size_t);
          typedef void* (*fn_load_w)(const char*);
          typedef void  (*fn_unload_w)(void*);
          typedef void* (*fn_kv_init)(uint32_t,uint32_t,uint32_t,uint32_t);
          typedef void  (*fn_kv_op)(void*);
          typedef int   (*fn_fwd)(void*,void*,const void*,uint32_t,void*,const char*,const char*,int,char*,size_t);
          typedef void  (*fn_mm)(const float*,const float*,float*,int,int,int);
          typedef size_t(*fn_allocs)(void);

          static void *g_dl=NULL, *g_arena=NULL, *g_weights=NULL, *g_kv=NULL;
          static fn_arena p_arena=NULL; static fn_load_w p_loadw=NULL; static fn_unload_w p_unloadw=NULL;
          static fn_kv_init p_kvinit=NULL; static fn_kv_op p_kvreset=NULL, p_kvfree=NULL;
          static fn_fwd p_fwd=NULL; static fn_mm p_mm=NULL; static fn_allocs p_allocs=NULL;
          static Axg1Hdr g_hdr; static Axg1Node *g_nodes=NULL;
          static char g_model[256]="none", g_mode[16]="fp4";
          static uint64_t g_raw=0, g_act=0; static double g_ms=0; static int g_kvu=0; static AxonQuotaState g_q;

          static void resolve_syms(void){
              if(g_dl) return;
              g_dl = dlopen("libaxon_android.so", RTLD_LAZY | RTLD_GLOBAL);
              void *h = g_dl ? g_dl : RTLD_DEFAULT;
              p_arena=(fn_arena)dlsym(h,"axon_arena_init"); p_loadw=(fn_load_w)dlsym(h,"axon_load_weights_file");
              p_unloadw=(fn_unload_w)dlsym(h,"axon_unload_weights"); p_kvinit=(fn_kv_init)dlsym(h,"axon_kv_cache_init");
              p_kvreset=(fn_kv_op)dlsym(h,"axon_kv_cache_reset"); p_kvfree=(fn_kv_op)dlsym(h,"axon_kv_cache_free");
              p_fwd=(fn_fwd)dlsym(h,"axon_forward"); p_mm=(fn_mm)dlsym(h,"axon_matmul_f32"); p_allocs=(fn_allocs)dlsym(h,"axon_live_allocs");
          }
          static double ms_now(void){ struct timespec t; clock_gettime(CLOCK_MONOTONIC,&t); return t.tv_sec*1000.0 + t.tv_nsec/1e6; }

          JNIEXPORT jboolean JNICALL Java_com_axon_AxonBridge_initQuota(JNIEnv *e, jobject t, jstring lic, jstring led, jboolean locked){
              (void)t; resolve_syms();
              const char *a=(*e)->GetStringUTFChars(e,lic,0), *b=(*e)->GetStringUTFChars(e,led,0);
              bool ok = axon_quota_init(&g_q, a, b, false, locked==JNI_TRUE);
              (*e)->ReleaseStringUTFChars(e,lic,a); (*e)->ReleaseStringUTFChars(e,led,b);
              return ok?JNI_TRUE:JNI_FALSE;
          }
          JNIEXPORT jboolean JNICALL Java_com_axon_AxonBridge_loadModel(JNIEnv *e, jobject t, jstring axgP, jstring axnP, jstring mdP){
              (void)t; resolve_syms(); if(p_arena && !g_arena) g_arena = p_arena(64ULL*1024ULL*1024ULL);
              const char *axg=(*e)->GetStringUTFChars(e,axgP,0), *axn=(*e)->GetStringUTFChars(e,axnP,0), *md=(*e)->GetStringUTFChars(e,mdP,0);
              if(*axg){
                  FILE *fg=fopen(axg,"rb");
                  if(fg && fread(&g_hdr,sizeof(Axg1Hdr),1,fg)==1 && memcmp(g_hdr.magic,"AXG1",4)==0){
                      if(g_nodes) free(g_nodes); g_nodes=(Axg1Node*)calloc(g_hdr.node_count,sizeof(Axg1Node));
                      if(fread(g_nodes,sizeof(Axg1Node),g_hdr.node_count,fg)==g_hdr.node_count){
                          if(p_kvfree&&g_kv) p_kvfree(g_kv);
                          if(p_kvinit) g_kv=p_kvinit(g_hdr.num_layers,g_hdr.num_heads,g_hdr.hidden_dim,g_hdr.max_seq_len);
                      }
                  }
                  if(fg) fclose(fg);
              }
              if(p_unloadw && g_weights) p_unloadw(g_weights);
              g_weights = p_loadw ? p_loadw(axn) : NULL;
              FILE *fn=fopen(axn,"rb"); if(fn){ fseek(fn,0,SEEK_END); g_act=(uint64_t)ftell(fn); fclose(fn); }
              g_raw = g_act * (strcmp(md,"fp4")==0 ? 7 : strcmp(md,"ternary")==0 ? 16 : 1);
              const char *bs=strrchr(axn,'/'); snprintf(g_model,sizeof(g_model),"%s",bs?bs+1:axn);
              snprintf(g_mode,sizeof(g_mode),"%s",md); g_kvu=0;
              (*e)->ReleaseStringUTFChars(e,axgP,axg); (*e)->ReleaseStringUTFChars(e,axnP,axn); (*e)->ReleaseStringUTFChars(e,mdP,md);
              return g_weights!=NULL ? JNI_TRUE : JNI_FALSE;
          }
          JNIEXPORT jboolean JNICALL Java_com_axon_AxonBridge_setMode(JNIEnv *e, jobject t, jstring mdP){
              (void)t; const char *md=(*e)->GetStringUTFChars(e,mdP,0);
              bool ok = !g_q.verified || axon_quota_is_mode_allowed(&g_q, md);

          wf("tool/gen_admin_hash.dart", r"""
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'package:axon_studio_app/security/pure_crypto.dart';

          void main(List<String> args) {
            final p = args.isNotEmpty ? args.first : 'mohsen@1390';
            final r = Random.secure();
            final salt = List.generate(16, (_) => r.nextInt(256).toRadixString(16).padLeft(2, '0')).join();
            final h = HmacLicenseService.pbkdf2(utf8.encode(p), utf8.encode(salt), 100000, 32).map((b) => b.toRadixString(16).padLeft(2, '0')).join();
            stdout.writeln('AXON_ADMIN_SALT=$salt');
            stdout.writeln('AXON_ADMIN_PBKDF2=$h');
          }
          """)

          wf("tool/axon_export_cli.dart", r"""
          import 'dart:convert';
          import 'dart:io';
          import 'package:axon_studio_app/models/models.dart';
          import 'package:axon_studio_app/security/pure_crypto.dart';

          Future<void> main(List<String> args) async {
            String brand = 'Axon Studio', scope = 'server_only', out = 'assets/config/axon_license.json';
            int wh = 40;
            for (var i = 0; i < args.length; i++) {
              if (args[i] == '--brand') { brand = args[++i]; }
              else if (args[i] == '--scope') { scope = args[++i]; }
              else if (args[i] == '--weekly-hours') { wh = int.parse(args[++i]); }
              else if (args[i] == '--out') { out = args[++i]; }
            }
            final k = Platform.environment['AXON_LICENSE_HMAC_KEY'] ?? 'AXON_V12_MASTER_HMAC_KEY_CHANGE_ME_IN_CI';
            final s = HmacLicenseService.signConfig(LicenseConfig(
              brandName: brand, edition: 'pro', scope: QuotaScope.fromWire(scope), maxTotalSeconds: 0, maxWeeklySeconds: wh * 3600,
              expiresUnix: 0, lockModels: false, allowedModes: const ['fp4', 'brain', 'ternary', 'f32', 'gpu'],
              issuedUnix: DateTime.now().millisecondsSinceEpoch ~/ 1000, nonce: HmacLicenseService.generateNonce(),
            ), key: k);
            final f = File(out); await f.parent.create(recursive: true);
            await f.writeAsString(const JsonEncoder.withIndent('  ').convert(s.toJson()));
          }
          """)

      - name: Compile Windows SFX Stub & Generate Admin Hash / License
        id: admin_hash
        working-directory: axon_studio_app
        env:
          RAW_PASS: ${{ secrets.AXON_ADMIN_PASSWORD || 'mohsen@1390' }}
          AXON_LICENSE_HMAC_KEY: ${{ env.HMAC_KEY }}
        run: |
          x86_64-w64-mingw32-gcc -O2 -mwindows native/axon_win_sfx.c -o assets/templates/axon_win_sfx.exe
          flutter pub get
          OUT=$(dart run tool/gen_admin_hash.dart "$RAW_PASS")
          SALT=$(echo "$OUT" | grep AXON_ADMIN_SALT | cut -d= -f2)
          HASH=$(echo "$OUT" | grep AXON_ADMIN_PBKDF2 | cut -d= -f2)
          echo "::add-mask::$SALT"
          echo "::add-mask::$HASH"
          echo "salt=$SALT" >> "$GITHUB_OUTPUT"
          echo "pbkdf2=$HASH" >> "$GITHUB_OUTPUT"
          dart run tool/axon_export_cli.dart \
            --brand "${{ github.event.inputs.brand_name || 'Axon Studio' }}" \
            --scope "${{ github.event.inputs.quota_scope || 'server_only' }}" \
            --weekly-hours "${{ github.event.inputs.max_weekly_hours || '40' }}"
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Upload Generated Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axon-source
          path: axon_studio_app
          include-hidden-files: true

  build-enduser-templates:
    name: Build End-User GUI Templates (${{ matrix.os }})
    needs: bootstrap-project
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-2025
          - os: macos
            runner: macos-15
          - os: android
            runner: ubuntu-24.04
          - os: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: axon-source
          path: axon_studio_app

      - uses: actions/setup-java@v4
        if: matrix.os == 'android'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build End-User GUI Template (${{ matrix.os }})
        working-directory: axon_studio_app
        shell: bash
        run: |
          set -e
          mkdir -p out_tpl assets/config assets/models assets/binaries
          touch assets/models/placeholder.txt assets/binaries/placeholder.txt
          flutter pub get
          FLAGS="--release --dart-define=AXON_ENDUSER_BUILD=true --dart-define=AXON_LICENSE_HMAC_KEY=${{ env.HMAC_KEY }}"
          if [ "${{ matrix.os }}" = "linux" ]; then
            sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
            flutter build linux $FLAGS
            tar -czf out_tpl/linux-enduser.tar.gz -C build/linux/x64/release/bundle .
          elif [ "${{ matrix.os }}" = "windows" ]; then
            flutter build windows $FLAGS
            powershell -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'out_tpl/windows-enduser.zip' -Force"
          elif [ "${{ matrix.os }}" = "macos" ]; then
            flutter build macos $FLAGS
            APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
            tar -czf out_tpl/macos-enduser.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          elif [ "${{ matrix.os }}" = "android" ]; then
            yes | flutter doctor --android-licenses >/dev/null 2>&1 || true
            flutter build apk $FLAGS --target-platform android-arm64
            cp build/app/outputs/flutter-apk/app-release.apk out_tpl/android-enduser.apk
          elif [ "${{ matrix.os }}" = "ios" ]; then
            flutter build ios $FLAGS --no-codesign
            mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
            zip -qry out_tpl/ios-enduser-unsigned.ipa Payload
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tpl-${{ matrix.os }}
          path: axon_studio_app/out_tpl/*

  build-master-android:
    name: Build Final Android Master APK (With All-OS Templates Inside)
    needs: [bootstrap-project, build-enduser-templates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: axon-source
          path: axon_studio_app

      - uses: actions/download-artifact@v4
        with:
          pattern: tpl-*
          merge-multiple: true
          path: axon_studio_app/assets/templates

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Embed All-OS Templates & Build Final Android Master APK
        working-directory: axon_studio_app
        env:
          ADMIN_SALT: ${{ needs.bootstrap-project.outputs.admin_salt }}
          ADMIN_PBKDF2: ${{ needs.bootstrap-project.outputs.admin_pbkdf2 }}
        run: |
          set -e
          rm -f assets/templates/placeholder.txt
          printf "    - assets/templates/\n" >> pubspec.yaml
          ls -lh assets/templates/
          yes | flutter doctor --android-licenses >/dev/null 2>&1 || true
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=AXON_ENDUSER_BUILD=false \
            --dart-define=AXON_LICENSE_HMAC_KEY="${{ env.HMAC_KEY }}" \
            --dart-define=AXON_ADMIN_SALT="$ADMIN_SALT" \
            --dart-define=AXON_ADMIN_PBKDF2="$ADMIN_PBKDF2"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AxonStudio-Master-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AxonStudio-Master-android
          path: axon_studio_app/dist/AxonStudio-Master-arm64.apk

          class MainActivity : FlutterActivity() {
              private val exec = Executors.newSingleThreadExecutor()
              private val main = Handler(Looper.getMainLooper())

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.axon/engine").setMethodCallHandler { call, res ->
                      exec.execute {
                          try {
                              val ans: Any? = when (call.method) {
                                  "nativeVersion" -> if (AxonBridge.coreLoaded) AxonBridge.nativeVersion() else "Axon Mobile"
                                  "getStorageDir" -> filesDir.absolutePath
                                  "extractAsset" -> streamAsset(call.argument<String>("assetKey")!!, call.argument<String>("targetPath")!!)
                                  "patchAndSignApk" -> patchAndSignApk(
                                      call.argument<String>("baseAssetKey")!!,
                                      call.argument<String>("licenseJson")!!,
                                      call.argument<List<String>>("modelPaths") ?: emptyList(),
                                      call.argument<String>("soPath"),
                                      call.argument<String>("outPath")!!
                                  )
                                  "patchIpa" -> patchIpa(
                                      call.argument<String>("baseAssetKey")!!,
                                      call.argument<String>("licenseJson")!!,
                                      call.argument<List<String>>("modelPaths") ?: emptyList(),
                                      call.argument<String>("outPath")!!
                                  )
                                  "saveToDownloads" -> saveToDownloads(
                                      call.argument<String>("srcPath")!!,
                                      call.argument<String>("subDir") ?: "AxonStudio",
                                      call.argument<String>("fileName")!!,
                                      call.argument<String>("mimeType") ?: "application/octet-stream"
                                  )
                                  "installOrShareFile" -> installOrShareFile(
                                      call.argument<String>("filePath")!!,
                                      call.argument<String>("mimeType") ?: "application/octet-stream"
                                  )
                                  "initQuota" -> if (AxonBridge.bridgeLoaded) AxonBridge.initQuota(
                                      call.argument("licensePath") ?: "", call.argument("ledgerPath") ?: "",
                                      call.argument("endUserLocked") ?: false
                                  ) else true
                                  "loadModel" -> {
                                      val axg = call.argument<String>("axgPath") ?: ""
                                      val axn = call.argument<String>("axnPath") ?: ""
                                      val md = call.argument<String>("mode") ?: "fp4"
                                      if (AxonBridge.bridgeLoaded) AxonBridge.loadModel(axg, axn, md)
                                      else if (AxonBridge.coreLoaded) AxonBridge.loadWeights(axn)
                                      else false
                                  }
                                  "setMode" -> if (AxonBridge.bridgeLoaded) AxonBridge.setMode(call.argument("mode") ?: "fp4") else true
                                  "resetKvCache" -> { if (AxonBridge.bridgeLoaded) AxonBridge.resetKvCache(); true }
                                  "getStatus" -> if (AxonBridge.bridgeLoaded) AxonBridge.getStatus()
                                      else "{\"edition\":\"mobile\",\"is_server\":false,\"quota_used_s\":0,\"quota_locked\":false,\"model\":\"none\",\"format\":\"-\",\"mode\":\"fp4\",\"raw_bytes\":0,\"active_bytes\":0,\"ram_saved\":0,\"flops_skipped\":0,\"last_ms\":0,\"opencl_device\":\"${if (AxonBridge.coreLoaded) "libaxon_android.so Loaded" else "ARM64 Ready (Upload .so or connect Remote)"}\"}"
                                  "runChat" -> if (AxonBridge.bridgeLoaded) AxonBridge.runChat(
                                      call.argument("prompt") ?: "", call.argument("maxTokens") ?: 256,
                                      (call.argument<Double>("temperature") ?: 0.7).toFloat()
                                  ) else "{\"reply\":\"لطفاً مدل .axg1/.axn3 و کتابخانه libaxon_android.so را بارگذاری کنید یا به سرور Axon متصل شوید.\",\"ms\":0,\"tok_per_sec\":0,\"tokens\":0,\"kv_used\":0,\"kv_max\":4096,\"quota_locked\":false}"
                                  "runBench" -> if (AxonBridge.bridgeLoaded) AxonBridge.runBench()

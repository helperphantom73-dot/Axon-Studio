          wf("lib/state/studio_controller.dart", r"""
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/foundation.dart';
          import '../app_config.dart';
          import '../models/models.dart';
          import '../security/security.dart';
          import '../services/engine_services.dart';
          import '../services/vault_service.dart';

          class StudioController extends ChangeNotifier {
            final DesktopProcessManager processManager = DesktopProcessManager();
            final MobileNativeBridge mobileBridge = MobileNativeBridge();
            final ChatHistoryStore _history = ChatHistoryStore();
            final VaultService vault = VaultService();

            AxonEngineClient? _client;
            Timer? _statusTimer, _quotaTimer;
            bool isRtl = true, isRemoteMode = false, isGenerating = false, isBenchmarking = false, adminUnlocked = false, isInitialized = false;
            String remoteUrl = 'http://192.168.1.100:8080';
            String? lastError;
            EngineStatus status = EngineStatus.empty();
            BenchResult? benchResult;
            LicenseConfig? licenseConfig;
            LicenseEvalResult? licenseEval;
            List<ChatSession> sessions = [];
            String? activeSessionId;

            bool get isDesktop => Platform.isWindows || Platform.isLinux || Platform.isMacOS;
            bool get isQuotaLocked => status.quotaLocked || (licenseEval?.quotaLocked ?? false);

            ChatSession get currentSession {
              if (sessions.isEmpty) {
                final s = ChatSession(id: '${DateTime.now().millisecondsSinceEpoch}', title: 'گفتگوی جدید Axon', updatedAt: DateTime.now(), messages: []);
                sessions = [s]; activeSessionId = s.id;
              }
              return sessions.firstWhere((s) => s.id == activeSessionId, orElse: () => sessions.first);
            }

            Future<void> initialize() async {
              if (isInitialized) { return; }
              isInitialized = true;
              try {
                if (!isDesktop) {
                  final dir = await mobileBridge.getStorageDir();
                  AppPaths.setMobileDataDir(dir);
                }
                await vault.load();
                sessions = await _history.loadSessions();
                if (sessions.isNotEmpty) { activeSessionId = sessions.first.id; }
                await _loadLicense();
                await _bootLocal();
                _statusTimer = Timer.periodic(const Duration(seconds: 4), (_) => refreshStatus());
                _quotaTimer = Timer.periodic(const Duration(seconds: 5), (_) => _tickQuota());
              } catch (e) {
                lastError = 'خطای راه‌اندازی: $e';
              }
              notifyListeners();
            }

            Future<void> _loadLicense() async {
              try {
                final raw = await AppPaths.loadBundledLicenseJson();
                if (raw != null && raw.trim().isNotEmpty) {
                  licenseConfig = LicenseConfig.fromJson(Map<String, dynamic>.from(jsonDecode(raw) as Map));
                }
                final ledger = File('${AppPaths.appDataDir().path}${Platform.pathSeparator}quota_ledger.dat');
                licenseEval = await HmacLicenseService.evaluateAndTick(cfg: licenseConfig, ledgerFile: ledger, isServerActive: processManager.isServerMode);
              } catch (e) {
                licenseEval = LicenseEvalResult(valid: false, quotaLocked: AppConfig.isEndUserBuild, reason: 'خطای لایسنس: $e');
              }
            }

            Future<void> _tickQuota() async {
              if (licenseConfig == null && !AppConfig.isEndUserBuild) { return; }
              final ledger = File('${AppPaths.appDataDir().path}${Platform.pathSeparator}quota_ledger.dat');
              licenseEval = await HmacLicenseService.evaluateAndTick(
                cfg: licenseConfig, ledgerFile: ledger, isServerActive: processManager.isServerMode || status.isServer, deltaSeconds: 5,
              );
              if (licenseEval?.quotaLocked == true && processManager.isRunning) { await processManager.stop(); }
              notifyListeners();
            }

            Future<void> _bootLocal() async {
              lastError = null;
              try {
                if (isDesktop) {
                  final bin = await AppPaths.findAxonBinary(preferPro: licenseConfig?.edition == 'pro');
                  if (bin != null) {
                    final axg = await AppPaths.findModelFile(licenseConfig?.bundledAxg ?? '');
                    final axn = await AppPaths.findModelFile(licenseConfig?.bundledAxn ?? '');
                    final st = await AppPaths.findModelFile(licenseConfig?.bundledSafetensors ?? '');
                    final allowed = licenseConfig?.allowedModes ?? ['fp4'];
                    final port = await processManager.startEngine(
                      binaryPath: bin, axgPath: axg?.path, axnPath: axn?.path, safetensorsPath: st?.path,
                      noTranspose: licenseConfig?.noTranspose ?? false, mode: AxonMode.fromWire(allowed.first),
                    );
                    _client = HttpAxonEngineClient('http://127.0.0.1:$port');
                    await refreshStatus();
                  }
                } else {
                  final dir = AppPaths.appDataDir().path;
                  final licP = '$dir/axon_license.json', ledP = '$dir/quota_ledger.dat';
                  if (licenseConfig != null) { await File(licP).writeAsString(jsonEncode(licenseConfig!.toJson())); }
                  await mobileBridge.initQuota(licP, ledP, AppConfig.isEndUserBuild);
                  if (licenseConfig != null && licenseConfig!.bundledAxn.isNotEmpty) {
                    final axnO = '$dir/${licenseConfig!.bundledAxn}';
                    await mobileBridge.extractAsset('assets/models/${licenseConfig!.bundledAxn}', axnO);
                    var axgO = '';
                    if (licenseConfig!.bundledAxg.isNotEmpty) {
                      axgO = '$dir/${licenseConfig!.bundledAxg}';
                      await mobileBridge.extractAsset('assets/models/${licenseConfig!.bundledAxg}', axgO);
                    }
                    await mobileBridge.loadModel(axgPath: axgO, axnPath: axnO, mode: AxonMode.fp4);
                  }
                  _client = mobileBridge;
                  await refreshStatus();
                }
              } catch (e) { lastError = '$e'; }
              notifyListeners();
            }

            bool isModeAllowed(AxonMode m) => licenseConfig?.allowedModes.contains(m.wire) ?? true;
            Future<void> refreshStatus() async { try { if (_client != null) { status = await _client!.fetchStatus(); notifyListeners(); } } catch (_) {} }
            Future<void> changeMode(AxonMode m) async { if (isModeAllowed(m) && !isQuotaLocked && _client != null && await _client!.setMode(m)) { await refreshStatus(); } }

            Future<void> uploadModelPair(List<File> files) async {
              if (licenseConfig?.lockModels == true || _client == null) { return; }
              for (final f in files) { await _client!.uploadModelFile(f); }
              await refreshStatus();
            }

            Future<void> sendMessage(String prompt) async {
              final t = prompt.trim();
              if (t.isEmpty || isGenerating || isQuotaLocked || _client == null) { return; }
              final s = currentSession;
              s.messages.add(ChatMessage(id: '${DateTime.now().microsecondsSinceEpoch}', isUser: true, text: t, timestamp: DateTime.now()));
              isGenerating = true; lastError = null; notifyListeners();
              try {
                final r = await _client!.sendChat(t);
                s.messages.add(ChatMessage(id: '${DateTime.now().microsecondsSinceEpoch}', isUser: false, text: r.reply, latencyMs: r.ms, tokPerSec: r.tokPerSec, tokens: r.tokens, kvUsed: r.kvUsed, kvMax: r.kvMax, timestamp: DateTime.now()));
                await _history.saveSessions(sessions); await refreshStatus();
              } catch (e) { lastError = '$e'; } finally { isGenerating = false; notifyListeners(); }
            }

            Future<void> runBench() async {
              if (_client == null || isBenchmarking) { return; }
              isBenchmarking = true; notifyListeners();
              try { benchResult = await _client!.runBenchmark(); } catch (e) { lastError = '$e'; } finally { isBenchmarking = false; notifyListeners(); }
            }

            Future<void> connectRemote(String url) async {
              remoteUrl = url.trim(); isRemoteMode = true; _client = HttpAxonEngineClient(remoteUrl);
              try { status = await _client!.fetchStatus(); lastError = null; } catch (e) { lastError = '$e'; }
              notifyListeners();
            }

            Future<void> switchToLocalMode() async { isRemoteMode = false; await _bootLocal(); }

            Future<void> toggleServerHost({required bool enableServer, int port = 8080}) async {
              if (!isDesktop) { return; }
              final bin = await AppPaths.findAxonBinary(preferPro: licenseConfig?.edition == 'pro');
              if (bin == null) { return; }
              final bound = await processManager.startEngine(binaryPath: bin, mode: status.mode, serveExternally: enableServer, requestedPort: enableServer ? port : 0);
              _client = HttpAxonEngineClient('http://127.0.0.1:$bound');
              await refreshStatus(); notifyListeners();
            }

            void createNewSession() { final s = ChatSession(id: '${DateTime.now().millisecondsSinceEpoch}', title: 'گفتگوی جدید', updatedAt: DateTime.now(), messages: []); sessions.insert(0, s); activeSessionId = s.id; _history.saveSessions(sessions); notifyListeners(); }
            void selectSession(String id) { activeSessionId = id; _client?.resetKvCache(); notifyListeners(); }
            void toggleLanguage() { isRtl = !isRtl; notifyListeners(); }
            @override void dispose() { _statusTimer?.cancel(); _quotaTimer?.cancel(); processManager.stop(); super.dispose(); }
          }
          """)


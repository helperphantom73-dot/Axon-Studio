name: Axon Studio v12 — Android Master (Builds All-OS Outputs On-Device)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      brand_name:
        description: 'Default Brand Name'
        required: false
        default: 'Axon Studio'
      quota_scope:
        description: 'Default Quota Scope (server_only / all_devices / unlimited_pro)'
        required: false
        default: 'server_only'
        type: choice
        options: [ server_only, all_devices, unlimited_pro ]
      max_weekly_hours:
        description: 'Default Weekly Hours Limit (0 = unlimited)'
        required: false
        default: '40'

env:
  FLUTTER_CHANNEL: 'stable'
  HMAC_KEY: ${{ secrets.AXON_LICENSE_HMAC_KEY || 'AXON_V12_MASTER_HMAC_KEY_CHANGE_ME_IN_CI' }}

jobs:
  bootstrap-project:
    name: Generate Axon Studio, Windows SFX Stub & Keystore
    runs-on: ubuntu-24.04
    outputs:
      admin_salt: ${{ steps.admin_hash.outputs.salt }}
      admin_pbkdf2: ${{ steps.admin_hash.outputs.pbkdf2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install MinGW-w64 (for Windows .exe SFX Stub)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Create Multi-Platform Flutter Skeleton
        run: |
          rm -rf axon_studio_app
          flutter create --org com.axon --project-name axon_studio_app \
            --platforms=linux,windows,macos,android,ios axon_studio_app

      - name: Auto-Import User Axon v12 Binaries & Models from Repo
        shell: python
        run: |
          import os, shutil
          app = "axon_studio_app"
          for d in [
              f"{app}/assets/config", f"{app}/assets/models", f"{app}/assets/binaries",
              f"{app}/assets/templates", f"{app}/native",
              f"{app}/android/app/src/main/jniLibs/arm64-v8a",
              f"{app}/android/app/src/main/kotlin/com/axon",
              f"{app}/android/app/src/main/kotlin/com/axon/axon_studio_app",
              f"{app}/android/app/src/main/assets",
              f"{app}/android/app/src/main/res/xml",
              f"{app}/ios/Runner", f"{app}/tool", f"{app}/test"
          ]:
              os.makedirs(d, exist_ok=True)
          for dp, _, fns in os.walk("."):
              if dp.startswith(f"./{app}") or "/.git" in dp or dp.startswith("./.git"):
                  continue
              for fn in fns:
                  src = os.path.join(dp, fn)
                  low = fn.lower()
                  if low in ("axon-studio", "axon-pro-studio", "axon-studio.exe", "axon-pro-studio.exe"):
                      shutil.copy2(src, f"{app}/assets/binaries/{fn}")
                  elif low.endswith((".axg1", ".axn3", ".safetensors")):
                      shutil.copy2(src, f"{app}/assets/models/{fn}")
                  elif "axon_android" in low and low.endswith(".so"):
                      shutil.copy2(src, f"{app}/android/app/src/main/jniLibs/arm64-v8a/libaxon_android.so")
                  elif low in ("libaxon_ios_arm64.a", "libaxon_ios_sim_arm64.a"):
                      shutil.copy2(src, f"{app}/ios/Runner/{fn}")
                  elif low == "axon_runtime.h":
                      shutil.copy2(src, f"{app}/native/axon_runtime.h")
                      shutil.copy2(src, f"{app}/ios/Runner/axon_runtime.h")
          for k in [f"{app}/assets/models/placeholder.txt", f"{app}/assets/binaries/placeholder.txt", f"{app}/assets/templates/placeholder.txt"]:
              with open(k, "w", encoding="utf-8") as f:
                  f.write("placeholder\n")

      - name: Generate On-Device APK Signing Keystore (PKCS12)
        run: |
          keytool -genkeypair -noprompt \
            -keystore axon_studio_app/android/app/src/main/assets/axon_signing.p12 \
            -storetype PKCS12 -alias axon -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass axon1390 -keypass axon1390 \
            -dname "CN=Axon Studio, OU=Axon, O=AxonAI, L=Tehran, C=IR"

      - name: Write Windows SFX Stub, Native C11/JNI/Kotlin/Swift & Flutter UI Codebase
        shell: python
        run: |
          import os, textwrap

          APP = "axon_studio_app"
          def wf(rel, body):
              p = os.path.join(APP, rel)
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="\n") as f:
                  f.write(textwrap.dedent(body).lstrip("\n"))

          if not os.path.exists(f"{APP}/native/axon_runtime.h"):
              h = r"""
              #ifndef AXON_RUNTIME_H
              #define AXON_RUNTIME_H
              #include <stddef.h>
              #include <stdint.h>
              void *axon_arena_init(size_t bytes);
              void *axon_load_weights_file(const char *path);
              void  axon_unload_weights(void *w);
              void *axon_kv_cache_init(uint32_t layers, uint32_t heads, uint32_t hidden, uint32_t max_seq);
              void  axon_kv_cache_reset(void *kv);
              void  axon_kv_cache_free(void *kv);
              int   axon_forward(void *arena, void *weights, const void *nodes, uint32_t node_count,
                                 void *kv, const char *mode, const char *prompt, int max_tokens,
                                 char *out_buf, size_t out_cap);
              void  axon_matmul_f32(const float *a, const float *b, float *c, int m, int n, int k);
              size_t axon_live_allocs(void);
              #endif
              """
              wf("native/axon_runtime.h", h)
              wf("ios/Runner/axon_runtime.h", h)

          wf("native/axon_win_sfx.c", r"""
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>

          static void make_magic(char out[17]) {
              const char a[] = "__AXON_";
              const char b[] = "WIN_ZIP__";
              memcpy(out, a, 7);
              memcpy(out + 7, b, 9);
              out[16] = '\0';
          }

          static int find_magic(FILE *f, uint64_t *out_off) {
              char magic[17]; make_magic(magic);
              uint8_t buf[65536 + 16];
              uint64_t pos = 0;
              size_t carry = 0;
              while (1) {
                  size_t n = fread(buf + carry, 1, 65536, f);
                  size_t total = carry + n;
                  if (total < 16) break;
                  for (size_t i = 0; i <= total - 16; ++i) {
                      if (memcmp(buf + i, magic, 16) == 0) {
                          *out_off = pos + i + 16;
                          return 1;
                      }
                  }
                  if (n == 0) break;
                  memmove(buf, buf + total - 15, 15);
                  pos += total - 15;
                  carry = 15;
              }
              return 0;
          }

          int WINAPI WinMain(HINSTANCE hInst, HINSTANCE hPrev, LPSTR lpCmdLine, int nCmdShow) {
              (void)hInst; (void)hPrev; (void)nCmdShow;
              char exePath[MAX_PATH]; GetModuleFileNameA(NULL, exePath, MAX_PATH);
              FILE *f = fopen(exePath, "rb");
              if (!f) return 1;
              uint64_t off = 0;
              if (!find_magic(f, &off)) {
                  fclose(f);
                  MessageBoxA(NULL, "No embedded Axon package found.", "Axon Studio", MB_ICONERROR);
                  return 2;
              }
              _fseeki64(f, 0, SEEK_END);
              uint64_t fsz = (uint64_t)_ftelli64(f);

              const char *localApp = getenv("LOCALAPPDATA");
              if (!localApp) localApp = getenv("TEMP");
              if (!localApp) localApp = "C:\\Windows\\Temp";
              char rootDir[MAX_PATH], pkgDir[MAX_PATH], zipPath[MAX_PATH], appExe[MAX_PATH];
              snprintf(rootDir, MAX_PATH, "%s\\AxonStudioPkg", localApp);
              CreateDirectoryA(rootDir, NULL);
              snprintf(pkgDir, MAX_PATH, "%s\\pkg_%llu", rootDir, (unsigned long long)fsz);
              CreateDirectoryA(pkgDir, NULL);
              snprintf(appExe, MAX_PATH, "%s\\axon_studio_app.exe", pkgDir);

              if (GetFileAttributesA(appExe) == INVALID_FILE_ATTRIBUTES) {
                  snprintf(zipPath, MAX_PATH, "%s\\payload.zip", pkgDir);
                  FILE *zf = fopen(zipPath, "wb");
                  if (!zf) { fclose(f); return 3; }
                  _fseeki64(f, (int64_t)off, SEEK_SET);
                  uint8_t io[65536]; size_t r;
                  while ((r = fread(io, 1, sizeof(io), f)) > 0) fwrite(io, 1, r, zf);
                  fclose(zf);
                  char cmd[MAX_PATH * 3];
                  snprintf(cmd, sizeof(cmd), "tar.exe -xf \"%s\" -C \"%s\"", zipPath, pkgDir);
                  STARTUPINFOA si = {0}; si.cb = sizeof(si); PROCESS_INFORMATION pi = {0};
                  if (CreateProcessA(NULL, cmd, NULL, NULL, FALSE, CREATE_NO_WINDOW, NULL, pkgDir, &si, &pi)) {
                      WaitForSingleObject(pi.hProcess, INFINITE);
                      CloseHandle(pi.hProcess); CloseHandle(pi.hThread);
                  }
                  DeleteFileA(zipPath);
              }
              fclose(f);

              char runCmd[MAX_PATH * 2];
              STARTUPINFOA si2 = {0}; si2.cb = sizeof(si2); PROCESS_INFORMATION pi2 = {0};
              if (lpCmdLine && strstr(lpCmdLine, "--serve")) {
                  snprintf(runCmd, sizeof(runCmd), "cmd.exe /c \"%s\\start_server.bat\"", pkgDir);
                  CreateProcessA(NULL, runCmd, NULL, NULL, FALSE, 0, NULL, pkgDir, &si2, &pi2);
              } else {
                  snprintf(runCmd, sizeof(runCmd), "\"%s\"", appExe);
                  CreateProcessA(NULL, runCmd, NULL, NULL, FALSE, 0, NULL, pkgDir, &si2, &pi2);
              }
              if (pi2.hProcess) { CloseHandle(pi2.hProcess); CloseHandle(pi2.hThread); }
              return 0;
          }
          """)

          wf("pubspec.yaml", r"""
          name: axon_studio_app
          description: Axon v12.0 Android Studio & All-OS Builder
          publish_to: "none"
          version: 1.2.0+12
          environment:
            sdk: ">=3.11.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            material_ui: ^1.11.1
            archive: ^4.0.7
            crypto: ^3.0.6
            file_picker: ^13.0.0
            qr: ^4.0.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/config/
              - assets/models/
              - assets/binaries/
          """)

          wf("native/axon_quota_guard.h", r"""
          #ifndef AXON_QUOTA_GUARD_H
          #define AXON_QUOTA_GUARD_H
          #include <stdint.h>
          #include <stdbool.h>
          #include <stddef.h>
          #ifndef AXON_LICENSE_HMAC_KEY
          #define AXON_LICENSE_HMAC_KEY "AXON_V12_MASTER_HMAC_KEY_CHANGE_ME_IN_CI"
          #endif
          typedef enum { AXON_SCOPE_SERVER_ONLY=0, AXON_SCOPE_ALL_DEVICES=1, AXON_SCOPE_UNLIMITED_PRO=2 } AxonQuotaScope;
          typedef struct {
              bool verified, quota_locked, lock_models, is_server;
              AxonQuotaScope scope;
              char brand_name[128], edition[32], allowed_modes[64];
              char bundled_axg[256], bundled_axn[256], bundled_safetensors[256], nonce[65], ledger_path[512];
              uint64_t max_total_s, max_weekly_s, expires_unix, quota_used_s, weekly_used_s, week_start_unix, last_wall_clock;
          } AxonQuotaState;
          bool axon_quota_init(AxonQuotaState *st, const char *lic_path, const char *ledger_path, bool is_server, bool enduser_locked);
          bool axon_quota_tick(AxonQuotaState *st, uint32_t delta_s);
          bool axon_quota_is_mode_allowed(const AxonQuotaState *st, const char *mode);
          void axon_hmac_sha256_hex(const char *key, const uint8_t *msg, size_t len, char out_hex[65]);
          #endif
          """)

          wf("native/axon_quota_guard.c", r"""
          #include "axon_quota_guard.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>

          typedef struct { uint32_t s[8]; uint64_t bits; uint8_t d[64]; size_t n; } s256;
          static inline uint32_t rr(uint32_t x, uint32_t n) { return (x >> n) | (x << (32 - n)); }
          static const uint32_t K[64] = {
              0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
              0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
              0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
              0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
              0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
              0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
              0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
              0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
          };
          static void xform(s256 *c, const uint8_t d[]) {
              uint32_t m[64], a,b,cc,dd,e,f,g,h,t1,t2;
              for(int i=0,j=0;i<16;++i,j+=4) m[i]=((uint32_t)d[j]<<24)|((uint32_t)d[j+1]<<16)|((uint32_t)d[j+2]<<8)|d[j+3];
              for(int i=16;i<64;++i){ uint32_t s0=rr(m[i-15],7)^rr(m[i-15],18)^(m[i-15]>>3); uint32_t s1=rr(m[i-2],17)^rr(m[i-2],19)^(m[i-2]>>10); m[i]=m[i-16]+s0+m[i-7]+s1; }
              a=c->s[0];b=c->s[1];cc=c->s[2];dd=c->s[3];e=c->s[4];f=c->s[5];g=c->s[6];h=c->s[7];
              for(int i=0;i<64;++i){
                  t1=h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^((~e)&g))+K[i]+m[i];
                  t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&cc)^(b&cc));
                  h=g;g=f;f=e;e=dd+t1;dd=cc;cc=b;b=a;a=t1+t2;
              }
              c->s[0]+=a;c->s[1]+=b;c->s[2]+=cc;c->s[3]+=dd;c->s[4]+=e;c->s[5]+=f;c->s[6]+=g;c->s[7]+=h;
          }
          static void s_init(s256 *c){
              c->n=0;c->bits=0;
              c->s[0]=0x6a09e667;c->s[1]=0xbb67ae85;c->s[2]=0x3c6ef372;c->s[3]=0xa54ff53a;
              c->s[4]=0x510e527f;c->s[5]=0x9b05688c;c->s[6]=0x1f83d9ab;c->s[7]=0x5be0cd19;
          }
          static void s_upd(s256 *c, const uint8_t *p, size_t l){
              for(size_t i=0;i<l;++i){ c->d[c->n++]=p[i]; if(c->n==64){ xform(c,c->d); c->bits+=512; c->n=0; } }
          }
          static void s_fin(s256 *c, uint8_t out[32]){
              size_t i=c->n;
              if(c->n<56){ c->d[i++]=0x80; while(i<56) c->d[i++]=0; }
              else { c->d[i++]=0x80; while(i<64) c->d[i++]=0; xform(c,c->d); memset(c->d,0,56); }
              c->bits+=c->n*8; for(int k=0;k<8;++k) c->d[63-k]=(uint8_t)(c->bits>>(k*8));
              xform(c,c->d);
              for(int j=0;j<8;++j){ out[j*4]=(c->s[j]>>24)&0xff; out[j*4+1]=(c->s[j]>>16)&0xff; out[j*4+2]=(c->s[j]>>8)&0xff; out[j*4+3]=c->s[j]&0xff; }
          }
          void axon_hmac_sha256_hex(const char *key, const uint8_t *msg, size_t len, char out_hex[65]){
              uint8_t kp[64]={0}; size_t kl=strlen(key);
              if(kl>64){ s256 c; s_init(&c); s_upd(&c,(const uint8_t*)key,kl); s_fin(&c,kp); } else memcpy(kp,key,kl);
              uint8_t ip[64],op[64],in[32],ou[32];
              for(int i=0;i<64;++i){ ip[i]=kp[i]^0x36; op[i]=kp[i]^0x5c; }
              s256 ci; s_init(&ci); s_upd(&ci,ip,64); s_upd(&ci,msg,len); s_fin(&ci,in);
              s256 co; s_init(&co); s_upd(&co,op,64); s_upd(&co,in,32); s_fin(&co,ou);
              static const char hx[]="0123456789abcdef";
              for(int i=0;i<32;++i){ out_hex[i*2]=hx[ou[i]>>4]; out_hex[i*2+1]=hx[ou[i]&0xf]; }
              out_hex[64]='\0';
          }
          static bool ct_eq(const char *a, const char *b, size_t n){ uint8_t d=0; for(size_t i=0;i<n;++i) d|=(uint8_t)a[i]^(uint8_t)b[i]; return d==0; }
          static bool j_str(const char *j,const char *k,char *o,size_t cap){
              char p[128]; snprintf(p,sizeof(p),"\"%s\"",k); const char *q=strstr(j,p); if(!q) return false;
              q=strchr(q+strlen(p),':'); if(!q) return false; q++; while(*q==' '||*q=='\t'||*q=='\n') q++;
              if(*q!='"') return false; q++; size_t i=0; while(*q && *q!='"' && i+1<cap) o[i++]=*q++; o[i]='\0'; return true;
          }
          static uint64_t j_u64(const char *j,const char *k,uint64_t dv){
              char p[128]; snprintf(p,sizeof(p),"\"%s\"",k); const char *q=strstr(j,p); if(!q) return dv;
              q=strchr(q+strlen(p),':'); if(!q) return dv; q++; while(*q==' '||*q=='\t') q++; return (uint64_t)strtoull(q,NULL,10);
          }
          static bool j_bool(const char *j,const char *k,bool dv){
              char p[128]; snprintf(p,sizeof(p),"\"%s\"",k); const char *q=strstr(j,p); if(!q) return dv;
              q=strchr(q+strlen(p),':'); if(!q) return dv; q++; while(*q==' '||*q=='\t') q++; return strncmp(q,"true",4)==0;
          }
          static void save_led(AxonQuotaState *st){
              if(!st->ledger_path[0]) return;
              char b[512],m[65]; snprintf(b,sizeof(b),"%s|%llu|%llu|%llu|%llu",st->nonce,(unsigned long long)st->quota_used_s,(unsigned long long)st->weekly_used_s,(unsigned long long)st->week_start_unix,(unsigned long long)st->last_wall_clock);
              axon_hmac_sha256_hex(AXON_LICENSE_HMAC_KEY,(const uint8_t*)b,strlen(b),m);
              FILE *f=fopen(st->ledger_path,"w"); if(f){ fprintf(f,"%s|%s\n",b,m); fclose(f); }
          }
          static bool load_led(AxonQuotaState *st, uint64_t now){
              FILE *f=fopen(st->ledger_path,"r"); if(!f){ st->week_start_unix=now; st->last_wall_clock=now; save_led(st); return true; }
              char ln[700]={0}; if(!fgets(ln,sizeof(ln),f)){ fclose(f); return false; } fclose(f);
              char nc[65]={0},mc[65]={0},ex[65]={0},b[512]={0}; unsigned long long t=0,w=0,ws=0,ls=0;
              if(sscanf(ln,"%64[^|]|%llu|%llu|%llu|%llu|%64s",nc,&t,&w,&ws,&ls,mc)!=6) return false;
              snprintf(b,sizeof(b),"%s|%llu|%llu|%llu|%llu",nc,t,w,ws,ls);
              axon_hmac_sha256_hex(AXON_LICENSE_HMAC_KEY,(const uint8_t*)b,strlen(b),ex);
              if(!ct_eq(mc,ex,64)||strcmp(nc,st->nonce)!=0||now+60<(uint64_t)ls) return false;
              st->quota_used_s=t; st->weekly_used_s=w; st->week_start_unix=ws; st->last_wall_clock=(now>(uint64_t)ls)?now:(uint64_t)ls;
              if(now>=st->week_start_unix+7ULL*86400ULL){ st->week_start_unix=now; st->weekly_used_s=0; }
              return true;
          }
          bool axon_quota_init(AxonQuotaState *st, const char *lic, const char *led, bool srv, bool locked){
              memset(st,0,sizeof(*st)); st->is_server=srv;
              snprintf(st->allowed_modes,sizeof(st->allowed_modes),"fp4,brain,ternary,f32,gpu");
              snprintf(st->edition,sizeof(st->edition),"standard");
              if(led) snprintf(st->ledger_path,sizeof(st->ledger_path),"%s",led);
              FILE *f=lic?fopen(lic,"rb"):NULL;
              if(!f){ st->verified=!locked; st->quota_locked=locked; return st->verified; }
              fseek(f,0,SEEK_END); long sz=ftell(f); fseek(f,0,SEEK_SET);
              if(sz<=0||sz>65536){ fclose(f); st->quota_locked=true; return false; }
              char *buf=(char*)calloc(1,(size_t)sz+1);
              if(fread(buf,1,(size_t)sz,f)!=(size_t)sz){ free(buf); fclose(f); st->quota_locked=true; return false; }
              fclose(f);
              char sc[32]={0}, sig[65]={0}; uint64_t iss=j_u64(buf,"issued_unix",0);
              j_str(buf,"brand_name",st->brand_name,sizeof(st->brand_name));
              j_str(buf,"edition",st->edition,sizeof(st->edition)); j_str(buf,"scope",sc,sizeof(sc));
              st->max_total_s=j_u64(buf,"max_total_seconds",0); st->max_weekly_s=j_u64(buf,"max_weekly_seconds",0);
              st->expires_unix=j_u64(buf,"expires_unix",0); st->lock_models=j_bool(buf,"lock_models",false);
              j_str(buf,"allowed_modes_csv",st->allowed_modes,sizeof(st->allowed_modes));
              j_str(buf,"bundled_axg",st->bundled_axg,sizeof(st->bundled_axg));
              j_str(buf,"bundled_axn",st->bundled_axn,sizeof(st->bundled_axn));
              j_str(buf,"bundled_safetensors",st->bundled_safetensors,sizeof(st->bundled_safetensors));
              j_str(buf,"nonce",st->nonce,sizeof(st->nonce)); j_str(buf,"signature",sig,sizeof(sig)); free(buf);
              st->scope = strcmp(sc,"all_devices")==0 ? AXON_SCOPE_ALL_DEVICES : (strcmp(sc,"unlimited_pro")==0 ? AXON_SCOPE_UNLIMITED_PRO : AXON_SCOPE_SERVER_ONLY);
              char canon[1400], exp[65];
              snprintf(canon,sizeof(canon),"AXON_LC_V1|%s|%s|%s|%llu|%llu|%llu|%d|%s|%s|%s|%s|%llu|%s",
                  st->brand_name,st->edition,sc,(unsigned long long)st->max_total_s,(unsigned long long)st->max_weekly_s,
                  (unsigned long long)st->expires_unix,st->lock_models?1:0,st->allowed_modes,st->bundled_axg,st->bundled_axn,st->bundled_safetensors,(unsigned long long)iss,st->nonce);
              axon_hmac_sha256_hex(AXON_LICENSE_HMAC_KEY,(const uint8_t*)canon,strlen(canon),exp);
              if(strlen(sig)!=64||!ct_eq(sig,exp,64)){ st->verified=false; st->quota_locked=true; return false; }
              st->verified=true; uint64_t now=(uint64_t)time(NULL);
              if(st->ledger_path[0]&&!load_led(st,now)){ st->quota_locked=true; return false; }
              return axon_quota_tick(st,0);
          }
          bool axon_quota_tick(AxonQuotaState *st, uint32_t ds){
              if(!st->verified){ st->quota_locked=true; return false; }
              if(st->scope==AXON_SCOPE_UNLIMITED_PRO || (st->scope==AXON_SCOPE_SERVER_ONLY&&!st->is_server)){ st->quota_locked=false; return true; }
              uint64_t now=(uint64_t)time(NULL);
              if(now+60<st->last_wall_clock){ st->quota_locked=true; return false; }
              st->last_wall_clock=now;
              if(st->expires_unix>0&&now>st->expires_unix){ st->quota_locked=true; save_led(st); return false; }
              st->quota_used_s+=ds; st->weekly_used_s+=ds;
              if((st->max_total_s>0&&st->quota_used_s>=st->max_total_s)||(st->max_weekly_s>0&&st->weekly_used_s>=st->max_weekly_s)) st->quota_locked=true;
              save_led(st); return !st->quota_locked;
          }
          bool axon_quota_is_mode_allowed(const AxonQuotaState *st, const char *mode){ return mode && *mode && strstr(st->allowed_modes,mode)!=NULL; }
          """)


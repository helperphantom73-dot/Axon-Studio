              char j[256]; snprintf(j,sizeof(j),"{\"cpu_ms\":%.3f,\"gpu_ms\":%.3f,\"cpu_gflops\":%.2f,\"gpu_gflops\":%.2f,\"speedup\":1.0,\"opencl_device\":\"ARM64 NEON\"}",ms,ms,gf,gf);
              return (*e)->NewStringUTF(e,j);
          }
          """)


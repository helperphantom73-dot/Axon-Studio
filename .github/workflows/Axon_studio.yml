          export 'pure_crypto.dart';

          class AdminAuth {
            static const List<int> _dbg = [0x37, 0x0E, 0x00, 0x1C, 0x13, 0x13, 0xC4, 0xBA, 0xA1, 0xA0, 0x90];
            static bool verifyPassword(String input) {
              if (AppConfig.isEndUserBuild) { return false; }
              if (AppConfig.adminPbkdf2Hex.isNotEmpty && AppConfig.adminSalt.isNotEmpty) {
                final d = HmacLicenseService.pbkdf2(utf8.encode(input), utf8.encode(AppConfig.adminSalt), 100000, 32);
                final hex = d.map((b) => b.toRadixString(16).padLeft(2, '0')).join();
                return HmacLicenseService.constantTimeEquals(hex, AppConfig.adminPbkdf2Hex.toLowerCase());
              }
              if (!kReleaseMode) {
                final b = utf8.encode(input);
                if (b.length != _dbg.length) { return false; }
                var diff = 0;
                for (var i = 0; i < b.length; i++) { diff |= (b[i] ^ (0x5A + i * 7)) ^ _dbg[i]; }
                return diff == 0;
              }
              return false;
            }
          }

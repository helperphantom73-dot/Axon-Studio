                  Wrap(spacing: 8, children: AxonMode.values.map((m) => FilterChip(selected: _modes.contains(m.wire), label: Text(m.title), onSelected: (v) { setState(() { if (v) { _modes.add(m.wire); } else if (_modes.length > 1) { _modes.remove(m.wire); } }); })).toList()),
                ])),
                const SizedBox(height: 12),
                GlassCard(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  const Text('۳. ساخت فایل‌های نصبی سیستم‌عامل‌های مختلف (ذخیره خودکار در Downloads)', style: TextStyle(fontWeight: FontWeight.bold)),
                  const SizedBox(height: 8),
                  Wrap(spacing: 8, children: BuildTarget.values.map((t) => FilterChip(selected: _targets.contains(t), label: Text(t.title), onSelected: (v) { setState(() { if (v) { _targets.add(t); } else { _targets.remove(t); } }); })).toList()),
                  const SizedBox(height: 12),
                  SizedBox(
                    width: double.infinity,
                    child: FilledButton.icon(
                      onPressed: _busy || _targets.isEmpty ? null : _export,

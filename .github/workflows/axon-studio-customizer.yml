name: Axon Studio v12 — Pro Customizer & Engine Vault (Addon)

on:
  workflow_run:
    workflows: ["Axon Studio v12 — Android Master (Builds All-OS Outputs On-Device)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'Admin Builder Password'
        required: false
        default: 'mohsen@1390'

permissions:
  contents: read
  actions: read

env:
  FLUTTER_CHANNEL: 'stable'
  HMAC_KEY: ${{ secrets.AXON_LICENSE_HMAC_KEY || 'AXON_V12_MASTER_HMAC_KEY_CHANGE_ME_IN_CI' }}

jobs:
  build-pro-android:
    name: Upgrade Vault, Customizer, Fix Password & Build Master APK
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Locate Latest Main Workflow Run ID
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID=$(gh run list --repo "${{ github.repository }}" \
              --workflow "Axon Studio v12 — Android Master (Builds All-OS Outputs On-Device)" \
              --limit 10 --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion=="success")][0].databaseId // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Run the main axon-studio.yml workflow first so templates are available."
            exit 1
          fi
          echo "Using template run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Base Source From Main Workflow
        uses: actions/download-artifact@v4
        with:
          name: axon-source
          path: axon_studio_app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find_run.outputs.run_id }}

      - name: Download Desktop & iOS Templates From Main Workflow
        uses: actions/download-artifact@v4
        with:
          pattern: tpl-*
          merge-multiple: true
          path: axon_studio_app/assets/templates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find_run.outputs.run_id }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Upgrade App Code (Dedicated Engine Slots, Custom Icon/Theme/Extension, .axpkg & OS Lock)
        shell: python
        run: |
          import os, textwrap

          APP = "axon_studio_app"
          def wf(rel, body):
              p = os.path.join(APP, rel)
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="\n") as f:
                  f.write(textwrap.dedent(body).lstrip("\n"))

          wf("lib/models/models.dart", r"""
          enum AxonMode {
            fp4('fp4', 'FP4 + Outliers', 'کوانتایز ۴ بیتی با حفظ وزن‌های کلیدی'),
            brain('brain', 'Brain-Routed Sparse', 'مسیریابی هوشمند ماتریس‌های sig_*'),
            ternary('ternary', 'Ternary 1.58-bit', 'وزن‌های سه‌حالته فوق‌سریع'),
            f32('f32', 'Dense F32', 'دقت کامل ممیز شناور ۳۲ بیتی'),
            gpu('gpu', 'OpenCL GPU', 'شتاب‌دهی کارت گرافیک OpenCL');
            final String wire, title, subtitleFa;
            const AxonMode(this.wire, this.title, this.subtitleFa);
            static AxonMode fromWire(String v) => AxonMode.values.firstWhere((m) => m.wire == v.toLowerCase(), orElse: () => AxonMode.fp4);
          }

          enum VaultSlot {
            winEngine('win_engine', 'موتور Windows (.exe)', 'axon-studio.exe'),
            linuxEngine('linux_engine', 'موتور Linux x86_64', 'axon-studio'),
            macEngine('mac_engine', 'موتور macOS', 'axon-studio'),
            androidSo('android_so', 'موتور Android (.so)', 'libaxon_android_arm64.so'),
            androidSdk('android_sdk', 'SDK اندروید (JNI / Kt / .h)', 'axon_mobile_jni.c'),
            iosArm64('ios_arm64', 'کتابخانه iOS ARM64 (.a)', 'libaxon_ios_arm64.a'),
            iosSim('ios_sim', 'کتابخانه iOS Sim (.a)', 'libaxon_ios_sim_arm64.a'),
            iosSdk('ios_sdk', 'SDK آیفون (Swift / modulemap)', 'AxonEngine.swift'),
            modelAxg('model_axg', 'گراف مدل Axon (.axg1)', 'mini_llm.axg1'),
            modelAxn('model_axn', 'وزن فشرده (.axn3 / .safetensors)', 'mini_llm.axn3');
            final String id, titleFa, hintFile;
            const VaultSlot(this.id, this.titleFa, this.hintFile);
            static VaultSlot fromId(String v) => VaultSlot.values.firstWhere((s) => s.id == v, orElse: () => VaultSlot.modelAxn);
          }

          class EngineStatus {
            final String edition, model, format, openclDevice;
            final bool isServer, quotaLocked;
            final int quotaUsedS, rawBytes, activeBytes;
            final AxonMode mode;
            final double ramSaved, flopsSkipped, lastMs;
            const EngineStatus({
              required this.edition, required this.isServer, required this.quotaUsedS, required this.quotaLocked,
              required this.model, required this.format, required this.mode, required this.rawBytes,
              required this.activeBytes, required this.ramSaved, required this.flopsSkipped, required this.lastMs, required this.openclDevice,
            });
            factory EngineStatus.empty() => const EngineStatus(
              edition: 'offline', isServer: false, quotaUsedS: 0, quotaLocked: false, model: 'none', format: '-',
              mode: AxonMode.fp4, rawBytes: 0, activeBytes: 0, ramSaved: 0, flopsSkipped: 0, lastMs: 0, openclDevice: 'Detecting...',
            );
            factory EngineStatus.fromJson(Map<String, dynamic> j) => EngineStatus(
              edition: (j['edition'] ?? 'standard').toString(), isServer: j['is_server'] == true,
              quotaUsedS: (j['quota_used_s'] as num?)?.toInt() ?? 0, quotaLocked: j['quota_locked'] == true,
              model: (j['model'] ?? 'none').toString(), format: (j['format'] ?? '-').toString(),
              mode: AxonMode.fromWire((j['mode'] ?? 'fp4').toString()),
              rawBytes: (j['raw_bytes'] as num?)?.toInt() ?? 0, activeBytes: (j['active_bytes'] as num?)?.toInt() ?? 0,
              ramSaved: (j['ram_saved'] as num?)?.toDouble() ?? 0, flopsSkipped: (j['flops_skipped'] as num?)?.toDouble() ?? 0,
              lastMs: (j['last_ms'] as num?)?.toDouble() ?? 0, openclDevice: (j['opencl_device'] ?? 'CPU SIMD').toString(),
            );
          }

          class BenchResult {
            final double cpuMs, gpuMs, cpuGflops, gpuGflops, speedup;
            final String openclDevice;
            const BenchResult({required this.cpuMs, required this.gpuMs, required this.cpuGflops, required this.gpuGflops, required this.speedup, required this.openclDevice});
            factory BenchResult.fromJson(Map<String, dynamic> j) => BenchResult(
              cpuMs: (j['cpu_ms'] as num?)?.toDouble() ?? 0, gpuMs: (j['gpu_ms'] as num?)?.toDouble() ?? 0,
              cpuGflops: (j['cpu_gflops'] as num?)?.toDouble() ?? 0, gpuGflops: (j['gpu_gflops'] as num?)?.toDouble() ?? 0,
              speedup: (j['speedup'] as num?)?.toDouble() ?? 1, openclDevice: (j['opencl_device'] ?? 'CPU').toString(),
            );
          }

          class ChatMessage {
            final String id, text;
            final bool isUser;
            final double? latencyMs, tokPerSec;
            final int? tokens, kvUsed, kvMax;
            final DateTime timestamp;
            const ChatMessage({required this.id, required this.isUser, required this.text, this.latencyMs, this.tokPerSec, this.tokens, this.kvUsed, this.kvMax, required this.timestamp});
            Map<String, dynamic> toJson() => {'id': id, 'isUser': isUser, 'text': text, 'latencyMs': latencyMs, 'tokPerSec': tokPerSec, 'tokens': tokens, 'kvUsed': kvUsed, 'kvMax': kvMax, 'timestamp': timestamp.toIso8601String()};
            factory ChatMessage.fromJson(Map<String, dynamic> j) => ChatMessage(
              id: j['id'].toString(), isUser: j['isUser'] == true, text: j['text'].toString(),
              latencyMs: (j['latencyMs'] as num?)?.toDouble(), tokPerSec: (j['tokPerSec'] as num?)?.toDouble(),
              tokens: (j['tokens'] as num?)?.toInt(), kvUsed: (j['kvUsed'] as num?)?.toInt(), kvMax: (j['kvMax'] as num?)?.toInt(),
              timestamp: DateTime.tryParse(j['timestamp']?.toString() ?? '') ?? DateTime.now(),
            );
          }

          class ChatSession {
            final String id, title;
            final DateTime updatedAt;
            final List<ChatMessage> messages;
            const ChatSession({required this.id, required this.title, required this.updatedAt, required this.messages});
            Map<String, dynamic> toJson() => {'id': id, 'title': title, 'updatedAt': updatedAt.toIso8601String(), 'messages': messages.map((m) => m.toJson()).toList()};
            factory ChatSession.fromJson(Map<String, dynamic> j) => ChatSession(
              id: j['id'].toString(), title: j['title'].toString(),
              updatedAt: DateTime.tryParse(j['updatedAt']?.toString() ?? '') ?? DateTime.now(),
              messages: ((j['messages'] as List?) ?? []).map((e) => ChatMessage.fromJson(Map<String, dynamic>.from(e as Map))).toList(),
            );
          }

          enum QuotaScope {
            serverOnly('server_only', 'فقط محدود در سرورها'),
            allDevices('all_devices', 'محدود در همه دستگاه‌ها'),
            unlimitedPro('unlimited_pro', 'کاملاً نامحدود (Pro)');
            final String wire, labelFa;
            const QuotaScope(this.wire, this.labelFa);
            static QuotaScope fromWire(String v) => QuotaScope.values.firstWhere((s) => s.wire == v, orElse: () => QuotaScope.serverOnly);
          }

          enum BuildTarget {
            android('android', 'Android (تک‌فایل نصبی)', 'apk'),
            windows('windows', 'Windows (تک‌فایل خوداجرا)', 'exe'),
            linux('linux', 'Linux (تک‌فایل GUI)', 'bin'),
            macos('macos', 'macOS (بسته .app)', 'app.tar.gz'),
            ios('ios', 'iOS (بسته .ipa)', 'ipa'),
            axpkg('axpkg', 'تک‌فایل کم‌حجم مدل+موتور Axon', 'axpkg');
            final String id, title, defaultExt;
            const BuildTarget(this.id, this.title, this.defaultExt);
          }

          class UiCustomConfig {
            final int accentArgb, bgArgb, symbolId;
            final bool allowChat, allowBench, allowServer, defaultRtl, hasCustomIcon;
            final String welcomeText;
            final List<String> allowedOs;

            const UiCustomConfig({
              this.accentArgb = 0xFF00E5FF,
              this.bgArgb = 0xFF090B10,
              this.symbolId = 0,
              this.allowChat = true,
              this.allowBench = true,
              this.allowServer = true,
              this.defaultRtl = true,
              this.hasCustomIcon = false,
              this.welcomeText = 'موتور Axon v12.0 آماده گفتگوی آفلاین است',
              this.allowedOs = const ['android', 'windows', 'linux', 'macos', 'ios'],
            });

            Map<String, dynamic> toJson() => {
              'accent_argb': accentArgb,
              'bg_argb': bgArgb,
              'symbol_id': symbolId,
              'allow_chat': allowChat,
              'allow_bench': allowBench,
              'allow_server': allowServer,
              'default_rtl': defaultRtl,
              'has_custom_icon': hasCustomIcon,
              'welcome_text': welcomeText,
              'allowed_os_csv': allowedOs.join(','),
            };

            factory UiCustomConfig.fromJson(Map<String, dynamic> j) => UiCustomConfig(
              accentArgb: (j['accent_argb'] as num?)?.toInt() ?? 0xFF00E5FF,
              bgArgb: (j['bg_argb'] as num?)?.toInt() ?? 0xFF090B10,
              symbolId: (j['symbol_id'] as num?)?.toInt() ?? 0,
              allowChat: j['allow_chat'] != false,
              allowBench: j['allow_bench'] != false,
              allowServer: j['allow_server'] != false,
              defaultRtl: j['default_rtl'] != false,
              hasCustomIcon: j['has_custom_icon'] == true,
              welcomeText: (j['welcome_text'] ?? 'موتور Axon v12.0 آماده گفتگوی آفلاین است').toString(),
              allowedOs: (j['allowed_os_csv'] ?? 'android,windows,linux,macos,ios').toString().split(',').where((e) => e.isNotEmpty).toList(),
            );
          }

          class LicenseConfig {
            final int version, maxTotalSeconds, maxWeeklySeconds, expiresUnix, issuedUnix;
            final String brandName, edition, bundledAxg, bundledAxn, bundledSafetensors, nonce, signature;
            final QuotaScope scope;
            final bool lockModels, noTranspose;
            final List<String> allowedModes;
            final UiCustomConfig uiCustom;

            const LicenseConfig({
              this.version = 1, required this.brandName, required this.edition, required this.scope,
              required this.maxTotalSeconds, required this.maxWeeklySeconds, required this.expiresUnix,
              required this.lockModels, required this.allowedModes, this.bundledAxg = '', this.bundledAxn = '',
              this.bundledSafetensors = '', this.noTranspose = false, required this.issuedUnix, required this.nonce,
              this.signature = '', this.uiCustom = const UiCustomConfig(),
            });

            String canonicalPayload() => [
              'AXON_LC_V1', brandName, edition, scope.wire, maxTotalSeconds, maxWeeklySeconds,
              expiresUnix, lockModels ? 1 : 0, allowedModes.join(','), bundledAxg, bundledAxn, bundledSafetensors, issuedUnix, nonce,
            ].join('|');

            Map<String, dynamic> toJson() => {
              'version': version, 'brand_name': brandName, 'edition': edition, 'scope': scope.wire,
              'max_total_seconds': maxTotalSeconds, 'max_weekly_seconds': maxWeeklySeconds, 'expires_unix': expiresUnix,
              'lock_models': lockModels, 'allowed_modes_csv': allowedModes.join(','), 'bundled_axg': bundledAxg,
              'bundled_axn': bundledAxn, 'bundled_safetensors': bundledSafetensors, 'no_transpose': noTranspose,
              'issued_unix': issuedUnix, 'nonce': nonce, 'signature': signature,
              'ui_custom': uiCustom.toJson(),
            };

            factory LicenseConfig.fromJson(Map<String, dynamic> j) => LicenseConfig(
              version: (j['version'] as num?)?.toInt() ?? 1, brandName: (j['brand_name'] ?? 'Axon Studio').toString(),
              edition: (j['edition'] ?? 'standard').toString(), scope: QuotaScope.fromWire((j['scope'] ?? 'server_only').toString()),
              maxTotalSeconds: (j['max_total_seconds'] as num?)?.toInt() ?? 0, maxWeeklySeconds: (j['max_weekly_seconds'] as num?)?.toInt() ?? 0,
              expiresUnix: (j['expires_unix'] as num?)?.toInt() ?? 0, lockModels: j['lock_models'] == true,
              allowedModes: (j['allowed_modes_csv'] ?? 'fp4,brain,ternary,f32,gpu').toString().split(',').where((e) => e.isNotEmpty).toList(),
              bundledAxg: (j['bundled_axg'] ?? '').toString(), bundledAxn: (j['bundled_axn'] ?? '').toString(),
              bundledSafetensors: (j['bundled_safetensors'] ?? '').toString(), noTranspose: j['no_transpose'] == true,
              issuedUnix: (j['issued_unix'] as num?)?.toInt() ?? 0, nonce: (j['nonce'] ?? '').toString(), signature: (j['signature'] ?? '').toString(),
              uiCustom: j['ui_custom'] is Map ? UiCustomConfig.fromJson(Map<String, dynamic>.from(j['ui_custom'] as Map)) : const UiCustomConfig(),
            );

            LicenseConfig withSignature(String sig) => LicenseConfig(
              version: version, brandName: brandName, edition: edition, scope: scope, maxTotalSeconds: maxTotalSeconds,
              maxWeeklySeconds: maxWeeklySeconds, expiresUnix: expiresUnix, lockModels: lockModels, allowedModes: allowedModes,
              bundledAxg: bundledAxg, bundledAxn: bundledAxn, bundledSafetensors: bundledSafetensors, noTranspose: noTranspose,
              issuedUnix: issuedUnix, nonce: nonce, signature: sig, uiCustom: uiCustom,
            );
          }

          class VaultAsset {
            final String id, name, slotId, storedPath;
            final int sizeBytes;
            final DateTime addedAt;
            const VaultAsset({required this.id, required this.name, required this.slotId, required this.storedPath, required this.sizeBytes, required this.addedAt});
            Map<String, dynamic> toJson() => {'id': id, 'name': name, 'slotId': slotId, 'storedPath': storedPath, 'sizeBytes': sizeBytes, 'addedAt': addedAt.toIso8601String()};
            factory VaultAsset.fromJson(Map<String, dynamic> j) => VaultAsset(
              id: j['id'].toString(), name: j['name'].toString(),
              slotId: (j['slotId'] ?? j['category'] ?? 'model_axn').toString(),
              storedPath: j['storedPath'].toString(), sizeBytes: (j['sizeBytes'] as num?)?.toInt() ?? 0,
              addedAt: DateTime.tryParse(j['addedAt']?.toString() ?? '') ?? DateTime.now(),
            );
          }
          """)

          wf("lib/services/vault_service.dart", r"""
          import 'dart:convert';
          import 'dart:io';
          import '../models/models.dart';
          import 'engine_services.dart';

          class VaultService {
            List<VaultAsset> items = [];

            Directory get vaultDir => Directory('${AppPaths.appDataDir().path}${Platform.pathSeparator}vault');
            File get _indexFile => File('${vaultDir.path}${Platform.pathSeparator}vault_index_v2.json');

            Future<void> load() async {
              await vaultDir.create(recursive: true);
              if (!await _indexFile.exists()) { items = []; return; }
              try {
                final list = jsonDecode(await _indexFile.readAsString()) as List;
                items = list.map((e) => VaultAsset.fromJson(Map<String, dynamic>.from(e as Map))).toList();
                items.removeWhere((x) => !File(x.storedPath).existsSync());
              } catch (_) { items = []; }
            }

            Future<VaultAsset> importToSlot(File src, VaultSlot slot, {bool replaceSlot = true}) async {
              await vaultDir.create(recursive: true);
              final name = src.uri.pathSegments.where((e) => e.isNotEmpty).last;
              final sub = Directory('${vaultDir.path}${Platform.pathSeparator}${slot.id}');
              await sub.create(recursive: true);
              if (replaceSlot && (slot != VaultSlot.androidSdk && slot != VaultSlot.iosSdk)) {
                final prev = items.where((i) => i.slotId == slot.id).toList();
                for (final p in prev) {
                  final pf = File(p.storedPath);
                  if (await pf.exists()) { await pf.delete(); }
                }
                items.removeWhere((i) => i.slotId == slot.id);
              }
              final dst = File('${sub.path}${Platform.pathSeparator}$name');
              await src.copy(dst.path);
              items.removeWhere((i) => i.slotId == slot.id && i.name == name);
              final asset = VaultAsset(
                id: '${slot.id}_$name', name: name, slotId: slot.id,
                storedPath: dst.path, sizeBytes: await dst.length(), addedAt: DateTime.now(),
              );
              items.add(asset);
              await _save();
              return asset;
            }

            VaultAsset? firstInSlot(VaultSlot slot) {
              for (final a in items) {
                if (a.slotId == slot.id) { return a; }
              }
              return null;
            }

            List<File> filesInSlot(VaultSlot slot) =>
                items.where((a) => a.slotId == slot.id).map((a) => File(a.storedPath)).toList();

            Future<void> deleteAsset(VaultAsset a) async {
              final f = File(a.storedPath);
              if (await f.exists()) { await f.delete(); }
              items.removeWhere((i) => i.id == a.id);
              await _save();
            }

            Future<void> _save() async {
              await vaultDir.create(recursive: true);
              await _indexFile.writeAsString(const JsonEncoder.withIndent('  ').convert(items.map((e) => e.toJson()).toList()), flush: true);
            }
          }
          """)

          wf("lib/services/engine_services.dart", r"""
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:archive/archive_io.dart';
          import 'package:flutter/services.dart';
          import '../models/models.dart';

          class AppPaths {
            static String? _mobileDataDir;

            static void setMobileDataDir(String path) {
              if (path.trim().isNotEmpty) { _mobileDataDir = path; }
            }

            static Directory appDataDir() {
              if (_mobileDataDir != null && _mobileDataDir!.isNotEmpty) {
                return Directory(_mobileDataDir!);
              }
              if (Platform.isAndroid || Platform.isIOS) {
                return Directory('${Directory.systemTemp.path}${Platform.pathSeparator}AxonStudio');
              }
              final home = Platform.environment['HOME'] ?? Platform.environment['USERPROFILE'] ?? Directory.systemTemp.path;
              if (Platform.isWindows) { return Directory('${Platform.environment['LOCALAPPDATA'] ?? '$home\\AppData\\Local'}\\AxonStudio'); }
              if (Platform.isMacOS) { return Directory('$home/Library/Application Support/AxonStudio'); }
              return Directory('$home/.local/share/axon-studio');
            }

            static String currentOsId() {
              if (Platform.isAndroid) { return 'android'; }
              if (Platform.isWindows) { return 'windows'; }
              if (Platform.isLinux) { return 'linux'; }
              if (Platform.isMacOS) { return 'macos'; }
              if (Platform.isIOS) { return 'ios'; }
              return 'unknown';
            }

            static List<Directory> searchRoots() {
              final list = <Directory>[
                Directory('${appDataDir().path}${Platform.pathSeparator}vault${Platform.pathSeparator}model_axg'),
                Directory('${appDataDir().path}${Platform.pathSeparator}vault${Platform.pathSeparator}model_axn'),
                Directory('${appDataDir().path}${Platform.pathSeparator}vault${Platform.pathSeparator}win_engine'),
                Directory('${appDataDir().path}${Platform.pathSeparator}vault${Platform.pathSeparator}linux_engine'),
                Directory('${appDataDir().path}${Platform.pathSeparator}vault${Platform.pathSeparator}mac_engine'),
                Directory('${appDataDir().path}${Platform.pathSeparator}imported_axpkg'),
                appDataDir(),
              ];
              if (Platform.isWindows || Platform.isLinux || Platform.isMacOS) {
                try {
                  final exe = File(Platform.resolvedExecutable).parent;
                  final sep = Platform.pathSeparator;
                  list.addAll([
                    exe,
                    Directory('${exe.path}${sep}bin'),
                    Directory('${exe.path}${sep}models'),
                    Directory('${exe.path}$sep..${sep}Resources'),
                    Directory('${exe.path}$sep..${sep}Resources${sep}bin'),
                    Directory('${exe.path}$sep..${sep}Resources${sep}models'),
                  ]);
                } catch (_) {}
              }
              return list;
            }

            static Future<String?> findAxonBinary({bool preferPro = true}) async {
              final names = Platform.isWindows ? [if (preferPro) 'axon-pro-studio.exe', 'axon-studio.exe'] : [if (preferPro) 'axon-pro-studio', 'axon-studio'];
              for (final r in searchRoots()) {
                for (final n in names) {
                  try {
                    final f = File('${r.path}${Platform.pathSeparator}$n');
                    if (await f.exists()) { return f.path; }
                  } catch (_) {}
                }
              }
              return null;
            }

            static Future<File?> findModelFile(String filename) async {
              if (filename.isEmpty) { return null; }
              try {
                if (await File(filename).exists()) { return File(filename); }
              } catch (_) {}
              for (final r in searchRoots()) {
                try {
                  final f = File('${r.path}${Platform.pathSeparator}$filename');
                  if (await f.exists()) { return f; }
                } catch (_) {}
              }
              return null;
            }

            static Future<String?> loadBundledLicenseJson() async {
              for (final r in searchRoots()) {
                try {
                  final f = File('${r.path}${Platform.pathSeparator}axon_license.json');
                  if (await f.exists()) { return await f.readAsString(); }
                } catch (_) {}
              }
              try {
                final t = await rootBundle.loadString('assets/config/axon_license.json');
                if (t.trim().isNotEmpty) { return t; }
              } catch (_) {}
              return null;
            }

            static Future<File?> unpackSingleBundle(File bundleFile) async {
              final bytes = await bundleFile.readAsBytes();
              final arch = ZipDecoder().decodeBytes(bytes);
              final dst = Directory('${appDataDir().path}${Platform.pathSeparator}imported_axpkg');
              if (await dst.exists()) { await dst.delete(recursive: true); }
              await dst.create(recursive: true);
              File? firstAxn;
              for (final e in arch) {
                if (!e.isFile) { continue; }
                final out = File('${dst.path}${Platform.pathSeparator}${e.name}');
                await out.parent.create(recursive: true);
                await out.writeAsBytes(e.readBytes() ?? []);
                if (e.name.toLowerCase().endsWith('.axn3') || e.name.toLowerCase().endsWith('.safetensors')) {
                  firstAxn ??= out;
                }
              }
              return firstAxn;
            }
          }

          class ChatResponse {
            final String reply; final double ms, tokPerSec; final int tokens, kvUsed, kvMax; final bool quotaLocked;
            const ChatResponse({required this.reply, required this.ms, required this.tokPerSec, required this.tokens, required this.kvUsed, required this.kvMax, required this.quotaLocked});
            factory ChatResponse.fromJson(Map<String, dynamic> j) => ChatResponse(
              reply: (j['reply'] ?? j['response'] ?? j['text'] ?? '').toString(),
              ms: (j['ms'] as num?)?.toDouble() ?? (j['last_ms'] as num?)?.toDouble() ?? 0,
              tokPerSec: (j['tok_per_sec'] as num?)?.toDouble() ?? 0,
              tokens: (j['tokens'] as num?)?.toInt() ?? 0, kvUsed: (j['kv_used'] as num?)?.toInt() ?? 0,
              kvMax: (j['kv_max'] as num?)?.toInt() ?? 4096, quotaLocked: j['quota_locked'] == true,
            );
          }

          abstract class AxonEngineClient {
            Future<EngineStatus> fetchStatus();
            Future<bool> setMode(AxonMode mode);
            Future<bool> uploadModelFile(File file);
            Future<ChatResponse> sendChat(String prompt, {int maxTokens = 256, double temperature = 0.7});
            Future<BenchResult> runBenchmark();
            Future<void> resetKvCache();
          }

          class HttpAxonEngineClient implements AxonEngineClient {
            final String baseUrl;
            final HttpClient _http = HttpClient()..connectionTimeout = const Duration(seconds: 6);
            HttpAxonEngineClient(this.baseUrl);
            String get _b => baseUrl.endsWith('/') ? baseUrl.substring(0, baseUrl.length - 1) : baseUrl;

            @override
            Future<EngineStatus> fetchStatus() async {
              final r = await (await _http.getUrl(Uri.parse('$_b/api/status'))).close();
              return EngineStatus.fromJson(Map<String, dynamic>.from(jsonDecode(await utf8.decodeStream(r)) as Map));
            }
            @override
            Future<bool> setMode(AxonMode mode) async {
              final r = await (await _http.postUrl(Uri.parse('$_b/api/mode?mode=${mode.wire}'))).close();
              await r.drain<void>(); return r.statusCode == 200;
            }
            @override
            Future<bool> uploadModelFile(File file) async {
              final req = await _http.postUrl(Uri.parse('$_b/api/upload?name=${Uri.encodeComponent(file.uri.pathSegments.last)}'));
              req.headers.set(HttpHeaders.contentTypeHeader, 'application/octet-stream');
              await req.addStream(file.openRead());
              final r = await req.close(); await r.drain<void>(); return r.statusCode == 200;
            }
            @override
            Future<ChatResponse> sendChat(String prompt, {int maxTokens = 256, double temperature = 0.7}) async {
              final req = await _http.postUrl(Uri.parse('$_b/api/chat'));
              req.headers.contentType = ContentType.json;
              req.write(jsonEncode({'prompt': prompt, 'max_tokens': maxTokens, 'temperature': temperature}));
              final r = await req.close();
              return ChatResponse.fromJson(Map<String, dynamic>.from(jsonDecode(await utf8.decodeStream(r)) as Map));
            }
            @override
            Future<BenchResult> runBenchmark() async {
              final r = await (await _http.getUrl(Uri.parse('$_b/api/bench'))).close();
              return BenchResult.fromJson(Map<String, dynamic>.from(jsonDecode(await utf8.decodeStream(r)) as Map));
            }
            @override
            Future<void> resetKvCache() async {}
          }

          class DesktopProcessManager {
            Process? _proc; int? port; bool isServerMode = false;
            bool get isRunning => _proc != null;

            Future<int> startEngine({
              required String binaryPath, String? axgPath, String? axnPath, String? safetensorsPath,
              bool noTranspose = false, AxonMode mode = AxonMode.fp4, bool serveExternally = false, int requestedPort = 0,
            }) async {
              await stop();
              final args = <String>[
                if (axgPath != null && axgPath.isNotEmpty) ...['--axg', axgPath],
                if (axnPath != null && axnPath.isNotEmpty) ...['--axn', axnPath],
                if (safetensorsPath != null && safetensorsPath.isNotEmpty) ...['--safetensors', safetensorsPath, if (noTranspose) '--no-transpose'],
                '--mode', mode.wire, '--serve', '--host', serveExternally ? '0.0.0.0' : '127.0.0.1', '--port', '$requestedPort',
              ];
              if (!Platform.isWindows) { await Process.run('chmod', ['+x', binaryPath]); }
              _proc = await Process.start(binaryPath, args, workingDirectory: File(binaryPath).parent.path);
              isServerMode = serveExternally;
              final comp = Completer<int>(); final rx = RegExp(r'LISTENING_PORT\s*=\s*(\d+)');
              void onLine(String l) {
                final m = rx.firstMatch(l);
                if (m != null && !comp.isCompleted) { final p = int.tryParse(m.group(1) ?? ''); if (p != null && p > 0) { port = p; comp.complete(p); } }
              }
              _proc!.stdout.transform(utf8.decoder).transform(const LineSplitter()).listen(onLine);
              _proc!.stderr.transform(utf8.decoder).transform(const LineSplitter()).listen(onLine);
              unawaited(_proc!.exitCode.then((c) { _proc = null; port = null; if (!comp.isCompleted) { comp.completeError(StateError('Exited $c')); } }));
              return comp.future.timeout(const Duration(seconds: 8), onTimeout: () {
                if (requestedPort > 0) { port = requestedPort; return requestedPort; }
                throw TimeoutException('No LISTENING_PORT=');
              });
            }

            Future<void> stop() async {
              final p = _proc; _proc = null; port = null;
              if (p != null) { p.kill(ProcessSignal.sigterm); await p.exitCode.timeout(const Duration(seconds: 2), onTimeout: () { p.kill(ProcessSignal.sigkill); return -1; }); }
            }
          }

          class MobileNativeBridge implements AxonEngineClient {
            static const _ch = MethodChannel('com.axon/engine');
            Future<String> getStorageDir() async => (await _ch.invokeMethod<String>('getStorageDir')) ?? '';
            Future<bool> extractAsset(String k, String p) async => (await _ch.invokeMethod<bool>('extractAsset', {'assetKey': k, 'targetPath': p})) ?? false;
            Future<bool> patchAndSignApk({required String baseAssetKey, required String licenseJson, required List<String> modelPaths, String? soPath, String? iconPath, required String outPath}) async =>
                (await _ch.invokeMethod<bool>('patchAndSignApk', {'baseAssetKey': baseAssetKey, 'licenseJson': licenseJson, 'modelPaths': modelPaths, 'soPath': soPath, 'iconPath': iconPath, 'outPath': outPath})) ?? false;
            Future<bool> patchIpa({required String baseAssetKey, required String licenseJson, required List<String> modelPaths, List<String> extraIosPaths = const [], required String outPath}) async =>
                (await _ch.invokeMethod<bool>('patchIpa', {'baseAssetKey': baseAssetKey, 'licenseJson': licenseJson, 'modelPaths': modelPaths, 'extraIosPaths': extraIosPaths, 'outPath': outPath})) ?? false;
            Future<String> saveToDownloads({required String srcPath, required String subDir, required String fileName, String mimeType = 'application/octet-stream'}) async =>
                (await _ch.invokeMethod<String>('saveToDownloads', {'srcPath': srcPath, 'subDir': subDir, 'fileName': fileName, 'mimeType': mimeType})) ?? srcPath;
            Future<bool> installOrShareFile(String filePath, {String mimeType = 'application/octet-stream'}) async =>
                (await _ch.invokeMethod<bool>('installOrShareFile', {'filePath': filePath, 'mimeType': mimeType})) ?? false;

            Future<bool> initQuota(String lic, String led, bool locked) async => (await _ch.invokeMethod<bool>('initQuota', {'licensePath': lic, 'ledgerPath': led, 'endUserLocked': locked})) ?? false;
            Future<bool> loadModel({required String axgPath, required String axnPath, required AxonMode mode}) async => (await _ch.invokeMethod<bool>('loadModel', {'axgPath': axgPath, 'axnPath': axnPath, 'mode': mode.wire})) ?? false;
            @override Future<EngineStatus> fetchStatus() async => EngineStatus.fromJson(Map<String, dynamic>.from(jsonDecode((await _ch.invokeMethod<String>('getStatus')) ?? '{}') as Map));
            @override Future<bool> setMode(AxonMode m) async => (await _ch.invokeMethod<bool>('setMode', {'mode': m.wire})) ?? false;
            @override Future<bool> uploadModelFile(File f) => loadModel(axgPath: '', axnPath: f.path, mode: AxonMode.fp4);
            @override Future<ChatResponse> sendChat(String p, {int maxTokens = 256, double temperature = 0.7}) async => ChatResponse.fromJson(Map<String, dynamic>.from(jsonDecode((await _ch.invokeMethod<String>('runChat', {'prompt': p, 'maxTokens': maxTokens, 'temperature': temperature})) ?? '{}') as Map));
            @override Future<BenchResult> runBenchmark() async => BenchResult.fromJson(Map<String, dynamic>.from(jsonDecode((await _ch.invokeMethod<String>('runBench')) ?? '{}') as Map));
            @override Future<void> resetKvCache() async => await _ch.invokeMethod('resetKvCache');
          }

          class ChatHistoryStore {
            Future<File> _f() async { final d = AppPaths.appDataDir(); await d.create(recursive: true); return File('${d.path}${Platform.pathSeparator}chat_history.json'); }
            Future<List<ChatSession>> loadSessions() async {
              try { final f = await _f(); if (!await f.exists()) { return []; } return (jsonDecode(await f.readAsString()) as List).map((e) => ChatSession.fromJson(Map<String, dynamic>.from(e as Map))).toList(); } catch (_) { return []; }
            }
            Future<void> saveSessions(List<ChatSession> s) async => (await _f()).writeAsString(jsonEncode(s.map((x) => x.toJson()).toList()), flush: true);
          }

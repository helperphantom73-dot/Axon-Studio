              if (req.linuxBinary != null && await req.linuxBinary!.exists()) { await req.linuxBinary!.copy('${stage.path}/linux_${req.linuxBinary!.uri.pathSegments.last}'); }
              if (req.macBinary != null && await req.macBinary!.exists()) { await req.macBinary!.copy('${stage.path}/macos_${req.macBinary!.uri.pathSegments.last}'); }

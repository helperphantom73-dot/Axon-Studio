                await req.linuxBinary!.copy('${stage.path}/bin/${req.linuxBinary!.uri.pathSegments.last}');
              }
              await File('${stage.path}/start-server.sh').writeAsString(
                '#!/usr/bin/env bash\nDIR="\$(cd "\$(dirname "\$0")" && pwd)"\n'
                'exec "\$DIR/bin/axon-studio" ${cfg.bundledAxg.isNotEmpty ? "--axg \"\$DIR/models/${cfg.bundledAxg}\" " : ""}'
                '${cfg.bundledAxn.isNotEmpty ? "--axn \"\$DIR/models/${cfg.bundledAxn}\" " : ""}--mode ${cfg.allowedModes.first} --serve --host 0.0.0.0 --port \${PORT:-8080}\n',
              );
              final arch = createArchiveFromDirectory(stage, includeDirName: false);

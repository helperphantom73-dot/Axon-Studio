              private fun streamAsset(assetKey: String, targetPath: String): Boolean {
                  val out = File(targetPath)
                  out.parentFile?.mkdirs()
                  return runCatching {
                      assets.open("flutter_assets/$assetKey").use { i ->
                          FileOutputStream(out).use { o -> i.copyTo(o, 65536) }
                      }
                      true
                  }.getOrDefault(false)
              }

              private fun resizePng(srcBmp: Bitmap, size: Int): ByteArray {
                  val scaled = Bitmap.createScaledBitmap(srcBmp, size, size, true)
                  val baos = ByteArrayOutputStream()
                  scaled.compress(Bitmap.CompressFormat.PNG, 100, baos)
                  if (scaled != srcBmp) scaled.recycle()
                  return baos.toByteArray()
              }

              private fun writeStored(zos: ZipOutputStream, name: String, data: ByteArray) {
                  val crc = CRC32().apply { update(data) }.value
                  val e = ZipEntry(name).apply {
                      method = ZipEntry.STORED
                      size = data.size.toLong()
                      compressedSize = data.size.toLong()
                      this.crc = crc
                  }
                  zos.putNextEntry(e)
                  zos.write(data)
                  zos.closeEntry()
              }

              private fun patchAndSignApk(
                  baseAssetKey: String, licenseJson: String, modelPaths: List<String>, soPath: String?, iconPath: String?, outPath: String
              ): Boolean {
                  val baseTmp = File(cacheDir, "tpl_base.apk")
                  val patchedTmp = File(cacheDir, "patched_unsigned.apk")
                  if (!streamAsset(baseAssetKey, baseTmp.absolutePath)) return false

                  val overrides = LinkedHashMap<String, Pair<ByteArray?, File?>>()
                  overrides["assets/flutter_assets/assets/config/axon_license.json"] = Pair(licenseJson.toByteArray(Charsets.UTF_8), null)
                  for (mp in modelPaths) {
                      val f = File(mp)
                      if (f.exists()) overrides["assets/flutter_assets/assets/models/${f.name}"] = Pair(null, f)
                  }
                  if (!soPath.isNullOrEmpty() && File(soPath).exists()) {
                      overrides["lib/arm64-v8a/libaxon_android.so"] = Pair(null, File(soPath))
                  }

                  val iconBmp = if (!iconPath.isNullOrEmpty() && File(iconPath).exists()) BitmapFactory.decodeFile(iconPath) else null
                  if (iconBmp != null) {
                      overrides["assets/flutter_assets/assets/config/brand_icon.png"] = Pair(resizePng(iconBmp, 192), null)
                  }

                  ZipFile(baseTmp).use { zf ->
                      if (iconBmp != null) {
                          val entriesScan = zf.entries()
                          while (entriesScan.hasMoreElements()) {
                              val name = entriesScan.nextElement().name
                              if (name.contains("ic_launcher") && name.endsWith(".png")) {
                                  val sz = when {
                                      name.contains("xxxhdpi") -> 192
                                      name.contains("xxhdpi") -> 144
                                      name.contains("xhdpi") -> 96
                                      name.contains("hdpi") -> 72
                                      else -> 48
                                  }
                                  overrides[name] = Pair(resizePng(iconBmp, sz), null)
                              }
                          }
                      }

                      ZipOutputStream(FileOutputStream(patchedTmp)).use { zos ->
                          val entries = zf.entries()
                          while (entries.hasMoreElements()) {
                              val e = entries.nextElement()
                              val name = e.name
                              if (e.isDirectory) continue
                              if (name.startsWith("META-INF/") && (name.endsWith(".SF") || name.endsWith(".RSA") || name.endsWith(".DSA") || name.endsWith(".EC") || name == "META-INF/MANIFEST.MF")) continue
                              if (overrides.containsKey(name)) continue

                              val newEntry = ZipEntry(name)
                              if (e.method == ZipEntry.STORED || name == "resources.arsc" || name.endsWith(".so") || name.endsWith(".png")) {
                                  val crc = CRC32()
                                  var total = 0L
                                  val buf = ByteArray(65536)
                                  zf.getInputStream(e).use { ins ->
                                      while (true) { val n = ins.read(buf); if (n <= 0) break; crc.update(buf, 0, n); total += n }
                                  }
                                  newEntry.method = ZipEntry.STORED
                                  newEntry.size = total; newEntry.compressedSize = total; newEntry.crc = crc.value
                                  zos.putNextEntry(newEntry)
                                  zf.getInputStream(e).use { ins -> ins.copyTo(zos, 65536) }
                              } else {
                                  newEntry.method = ZipEntry.DEFLATED
                                  zos.putNextEntry(newEntry)
                                  zf.getInputStream(e).use { ins -> ins.copyTo(zos, 65536) }
                              }
                              zos.closeEntry()
                          }

                          for ((name, src) in overrides) {
                              val (bytes, file) = src
                              if (name.endsWith(".so") || name.endsWith(".png")) {
                                  if (bytes != null) writeStored(zos, name, bytes)
                                  else {
                                      val crc = CRC32(); val buf = ByteArray(65536); var total = 0L
                                      FileInputStream(file!!).use { ins -> while (true) { val n = ins.read(buf); if (n <= 0) break; crc.update(buf, 0, n); total += n } }
                                      val ne = ZipEntry(name).apply { method = ZipEntry.STORED; size = total; compressedSize = total; this.crc = crc.value }
                                      zos.putNextEntry(ne)
                                      FileInputStream(file).use { ins -> ins.copyTo(zos, 65536) }
                                      zos.closeEntry()
                                  }
                              } else {
                                  zos.putNextEntry(ZipEntry(name).apply { method = ZipEntry.DEFLATED })
                                  if (bytes != null) zos.write(bytes)
                                  else FileInputStream(file!!).use { ins -> ins.copyTo(zos, 65536) }
                                  zos.closeEntry()
                              }
                          }
                      }
                  }
                  iconBmp?.recycle()

                  val ks = KeyStore.getInstance("PKCS12")
                  assets.open("axon_signing.p12").use { ks.load(it, "axon1390".toCharArray()) }
                  val privKey = ks.getKey("axon", "axon1390".toCharArray()) as PrivateKey
                  val cert = ks.getCertificate("axon") as X509Certificate
                  val signerConfig = ApkSigner.SignerConfig.Builder("AXON", privKey, listOf(cert)).build()

                  val outFile = File(outPath)
                  outFile.parentFile?.mkdirs()
                  ApkSigner.Builder(listOf(signerConfig))
                      .setInputApk(patchedTmp)
                      .setOutputApk(outFile)
                      .setV1SigningEnabled(true).setV2SigningEnabled(true).setV3SigningEnabled(true)
                      .setMinSdkVersion(26).build().sign()

                  val vr = ApkVerifier.Builder(outFile).build().verify()
                  baseTmp.delete(); patchedTmp.delete()
                  return vr.isVerified
              }

              private fun patchIpa(baseAssetKey: String, licenseJson: String, modelPaths: List<String>, extraIosPaths: List<String>, outPath: String): Boolean {
                  val baseTmp = File(cacheDir, "tpl_base.ipa")
                  if (!streamAsset(baseAssetKey, baseTmp.absolutePath)) return false
                  val outFile = File(outPath); outFile.parentFile?.mkdirs()
                  ZipFile(baseTmp).use { zf ->
                      ZipOutputStream(FileOutputStream(outFile)).use { zos ->
                          val entries = zf.entries()
                          while (entries.hasMoreElements()) {
                              val e = entries.nextElement()
                              if (e.isDirectory || e.name.endsWith("axon_license.json")) continue
                              zos.putNextEntry(ZipEntry(e.name))
                              zf.getInputStream(e).use { it.copyTo(zos, 65536) }
                              zos.closeEntry()
                          }
                          zos.putNextEntry(ZipEntry("Payload/Runner.app/axon_license.json"))
                          zos.write(licenseJson.toByteArray(Charsets.UTF_8)); zos.closeEntry()
                          for (mp in modelPaths) {
                              val f = File(mp)
                              if (f.exists()) { zos.putNextEntry(ZipEntry("Payload/Runner.app/models/${f.name}")); FileInputStream(f).use { it.copyTo(zos, 65536) }; zos.closeEntry() }
                          }
                          for (ep in extraIosPaths) {
                              val f = File(ep)
                              if (f.exists()) { zos.putNextEntry(ZipEntry("Payload/Runner.app/axon_sdk/${f.name}")); FileInputStream(f).use { it.copyTo(zos, 65536) }; zos.closeEntry() }
                          }
                      }
                  }
                  baseTmp.delete()
                  return true
              }

              private fun saveToDownloads(srcPath: String, subDir: String, fileName: String, mimeType: String): String {
                  val src = File(srcPath)
                  if (!src.exists()) return srcPath
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                          put(MediaStore.Downloads.MIME_TYPE, mimeType)
                          put(MediaStore.Downloads.RELATIVE_PATH, "${Environment.DIRECTORY_DOWNLOADS}/$subDir")
                          put(MediaStore.Downloads.IS_PENDING, 1)
                      }
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values) ?: return srcPath
                      contentResolver.openOutputStream(uri)?.use { out -> FileInputStream(src).use { it.copyTo(out, 65536) } }
                      values.clear(); values.put(MediaStore.Downloads.IS_PENDING, 0)
                      contentResolver.update(uri, values, null, null)
                      return "Download/$subDir/$fileName"
                  } else {
                      @Suppress("DEPRECATION")
                      val dl = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), subDir)
                      dl.mkdirs(); val dst = File(dl, fileName); src.copyTo(dst, overwrite = true); return dst.absolutePath
                  }
              }

              private fun installOrShareFile(filePath: String, mimeType: String): Boolean {
                  val f = File(filePath); if (!f.exists()) return false
                  val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", f)
                  val intent = if (filePath.endsWith(".apk")) {
                      Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                  } else {
                      Intent.createChooser(Intent(Intent.ACTION_SEND).apply {
                          type = mimeType; putExtra(Intent.EXTRA_STREAM, uri); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }, "Share Axon Export")
                  }
                  startActivity(intent)
                  return true
              }

              override fun onDestroy() { exec.shutdownNow(); super.onDestroy() }
          }
          """)


          import 'dart:convert';
          import 'dart:io';
          import 'package:archive/archive_io.dart';
          import '../models/models.dart';
          import '../security/security.dart';
          import '../services/engine_services.dart';

          class ExportedFileInfo {
            final String label, internalPath, downloadsPath, mimeType;
            const ExportedFileInfo({required this.label, required this.internalPath, required this.downloadsPath, required this.mimeType});
          }

          class BuildAssetsRequest {
            final LicenseConfig unsignedLicense;
            final Set<BuildTarget> targets;
            final Map<BuildTarget, String> customExts;
            final String customBaseName;
            final Directory workDir;
            final File? axgFile, axnFile, safetensorsFile, linuxBinary, windowsBinary, macBinary, androidSo, iosArm64A, iosSimA, iconPng;
            final List<File> extraAndroidFiles, extraIosFiles;
            const BuildAssetsRequest({
              required this.unsignedLicense, required this.targets, required this.customExts, required this.customBaseName, required this.workDir,
              this.axgFile, this.axnFile, this.safetensorsFile, this.linuxBinary, this.windowsBinary, this.macBinary,
              this.androidSo, this.iosArm64A, this.iosSimA, this.iconPng,
              this.extraAndroidFiles = const [], this.extraIosFiles = const [],
            });
          }

          class MultiTargetExporter {
            final MobileNativeBridge _bridge = MobileNativeBridge();

            String _ext(BuildAssetsRequest r, BuildTarget t) {
              final raw = (r.customExts[t] ?? '').trim().replaceAll(RegExp(r'^\.+'), '');
              return raw.isEmpty ? t.defaultExt : raw;
            }

            Future<List<ExportedFileInfo>> exportAll(BuildAssetsRequest req, void Function(String) log) async {
              await req.workDir.create(recursive: true);
              final signed = HmacLicenseService.signConfig(req.unsignedLicense);
              final licJson = const JsonEncoder.withIndent('  ').convert(signed.toJson());
              final slug = (req.customBaseName.trim().isEmpty ? signed.brandName : req.customBaseName)
                  .toLowerCase().replaceAll(RegExp(r'[^a-z0-9_-]+'), '-');
              final subDir = 'AxonStudio/$slug';
              final exported = <ExportedFileInfo>[];

              log('✓ لایسنس HMAC-SHA256 امضا شد (Nonce: ${signed.nonce.substring(0, 8)}...)');
              log('✓ سیستم‌عامل‌های مجاز: ${signed.uiCustom.allowedOs.join(', ')}');

              for (final t in req.targets) {
                log('\n▶ ساخت خروجی تک‌فایل برای ${t.title}...');
                switch (t) {
                  case BuildTarget.android:
                    final a = await _apk(req, signed, licJson, slug, subDir, log);
                    if (a != null) { exported.add(a); }
                    break;
                  case BuildTarget.windows:
                    final w = await _win(req, signed, licJson, slug, subDir, log);
                    if (w != null) { exported.add(w); }
                    break;
                  case BuildTarget.linux:
                    final l = await _lin(req, signed, licJson, slug, subDir, log);
                    if (l != null) { exported.add(l); }
                    break;
                  case BuildTarget.macos:
                    final m = await _mac(req, signed, licJson, slug, subDir, log);
                    if (m != null) { exported.add(m); }
                    break;
                  case BuildTarget.ios:
                    final i = await _ios(req, signed, licJson, slug, subDir, log);
                    if (i != null) { exported.add(i); }
                    break;
                  case BuildTarget.axpkg:
                    exported.add(await _axpkg(req, signed, licJson, slug, subDir, log));
                    break;
                }
              }
              log('\n✅ تمام خروجی‌ها در Download/$subDir ذخیره شدند.');
              return exported;
            }

            Future<void> _stageData(Directory dir, BuildAssetsRequest req, String licJson) async {
              await Directory('${dir.path}/models').create(recursive: true);
              await Directory('${dir.path}/bin').create(recursive: true);
              await File('${dir.path}/axon_license.json').writeAsString(licJson);
              for (final f in [req.axgFile, req.axnFile, req.safetensorsFile]) {
                if (f != null && await f.exists()) { await f.copy('${dir.path}/models/${f.uri.pathSegments.last}'); }
              }
              if (req.iconPng != null && await req.iconPng!.exists()) {
                await req.iconPng!.copy('${dir.path}/brand_icon.png');
              }
            }

            Future<void> _extractZip(File zip, Directory dst) async {
              final arch = ZipDecoder().decodeBytes(await zip.readAsBytes());
              for (final entry in arch) {
                final out = '${dst.path}/${entry.name}';
                if (entry.isFile) {
                  final f = File(out); await f.parent.create(recursive: true);
                  await f.writeAsBytes(entry.readBytes() ?? []);
                } else { await Directory(out).create(recursive: true); }
              }
            }

            Future<void> _extractTarGz(File tgz, Directory dst) async {
              final tarBytes = GZipDecoder().decodeBytes(await tgz.readAsBytes());
              final arch = TarDecoder().decodeBytes(tarBytes);
              for (final entry in arch) {
                final out = '${dst.path}/${entry.name}';
                if (entry.isFile) {
                  final f = File(out); await f.parent.create(recursive: true);
                  await f.writeAsBytes(entry.readBytes() ?? []);
                } else { await Directory(out).create(recursive: true); }
              }
            }

            Future<ExportedFileInfo?> _apk(BuildAssetsRequest req, LicenseConfig cfg, String licJson, String slug, String subDir, void Function(String) log) async {
              final ext = _ext(req, BuildTarget.android);
              final fn = '$slug-android.$ext';
              final outPath = '${req.workDir.path}/$fn';
              final modelPaths = [req.axgFile?.path, req.axnFile?.path, req.safetensorsFile?.path].whereType<String>().toList();
              final ok = await _bridge.patchAndSignApk(
                baseAssetKey: 'assets/templates/android-enduser.apk',
                licenseJson: licJson, modelPaths: modelPaths,
                soPath: req.androidSo?.path, iconPath: req.iconPng?.path, outPath: outPath,
              );
              if (!ok) { log('⚠ ساخت/امضای APK ناموفق بود.'); return null; }
              final dl = await _bridge.saveToDownloads(srcPath: outPath, subDir: subDir, fileName: fn, mimeType: 'application/vnd.android.package-archive');
              log('✓ تک‌فایل نصبی اندروید با آیکون و موتور شما ساخته شد:\n  $dl');
              return ExportedFileInfo(label: 'نصب / اشتراک $fn', internalPath: outPath, downloadsPath: dl, mimeType: 'application/vnd.android.package-archive');
            }

            Future<ExportedFileInfo?> _win(BuildAssetsRequest req, LicenseConfig cfg, String licJson, String slug, String subDir, void Function(String) log) async {
              final ext = _ext(req, BuildTarget.windows);
              final fn = '$slug-win64.$ext';
              final tplZip = File('${req.workDir.path}/_tpl_win.zip');
              final stage = Directory('${req.workDir.path}/_stage_win_$slug');
              if (await stage.exists()) { await stage.delete(recursive: true); }
              await stage.create(recursive: true);
              if (await _bridge.extractAsset('assets/templates/windows-enduser.zip', tplZip.path)) {
                await _extractZip(tplZip, stage); await tplZip.delete();
              }
              await _stageData(stage, req, licJson);
              if (req.windowsBinary != null && await req.windowsBinary!.exists()) {
                await req.windowsBinary!.copy('${stage.path}/bin/${req.windowsBinary!.uri.pathSegments.last}');
              }
              await File('${stage.path}/start_server.bat').writeAsString(
                '@echo off\r\nbin\\axon-studio.exe ${cfg.bundledAxg.isNotEmpty ? "--axg models\\${cfg.bundledAxg} " : ""}'
                '${cfg.bundledAxn.isNotEmpty ? "--axn models\\${cfg.bundledAxn} " : ""}--mode ${cfg.allowedModes.first} --serve --host 0.0.0.0 --port 8080\r\n',
              );
              final zipBytes = ZipEncoder().encode(createArchiveFromDirectory(stage, includeDirName: false));
              final stubFile = File('${req.workDir.path}/_win_sfx.exe');
              final out = File('${req.workDir.path}/$fn');
              if (await _bridge.extractAsset('assets/templates/axon_win_sfx.exe', stubFile.path)) {
                final sink = out.openWrite();
                sink.add(await stubFile.readAsBytes()); sink.add(utf8.encode('__AXON_WIN_ZIP__')); sink.add(zipBytes);
                await sink.close(); await stubFile.delete();
              } else {
                await out.writeAsBytes(zipBytes);
              }
              await stage.delete(recursive: true);
              final dl = await _bridge.saveToDownloads(srcPath: out.path, subDir: subDir, fileName: fn, mimeType: 'application/octet-stream');
              log('✓ تک‌فایل خوداجرای Windows با موتور axon-studio.exe ساخته شد:\n  $dl');
              return ExportedFileInfo(label: 'اشتراک $fn', internalPath: out.path, downloadsPath: dl, mimeType: 'application/octet-stream');
            }

            Future<ExportedFileInfo?> _lin(BuildAssetsRequest req, LicenseConfig cfg, String licJson, String slug, String subDir, void Function(String) log) async {
              final ext = _ext(req, BuildTarget.linux);
              final fn = '$slug-linux-x64.$ext';
              final tplTgz = File('${req.workDir.path}/_tpl_lin.tar.gz');

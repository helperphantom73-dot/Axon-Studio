          wf("lib/main.dart", r"""
          import 'package:flutter/services.dart';
          import 'package:material_ui/material_ui.dart';
          import 'app_config.dart';
          import 'security/security.dart';
          import 'state/studio_controller.dart';
          import 'ui/screens.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const AxonStudioApp());
          }

          class AxonStudioApp extends StatefulWidget {
            const AxonStudioApp({super.key});
            @override State<AxonStudioApp> createState() => _AxonStudioAppState();
          }

          class _AxonStudioAppState extends State<AxonStudioApp> {
            final StudioController _controller = StudioController();

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addPostFrameCallback((_) => _controller.initialize());
            }

            @override
            void dispose() { _controller.dispose(); super.dispose(); }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: _controller,
                builder: (_, __) {
                  final accent = Color(_controller.uiCustom.accentArgb);
                  final bg = Color(_controller.uiCustom.bgArgb);
                  return MaterialApp(
                    debugShowCheckedModeBanner: false,
                    title: _controller.licenseConfig?.brandName ?? AppConfig.brandName,
                    themeMode: ThemeMode.dark,
                    darkTheme: ThemeData(
                      brightness: Brightness.dark,
                      scaffoldBackgroundColor: bg,
                      colorScheme: ColorScheme.fromSeed(seedColor: accent, brightness: Brightness.dark, surface: const Color(0xFF121722)),
                      useMaterial3: true,
                    ),
                    home: StudioShell(controller: _controller),
                  );
                },
              );
            }
          }

          class StudioShell extends StatefulWidget {
            final StudioController controller;
            const StudioShell({super.key, required this.controller});
            @override State<StudioShell> createState() => _ShellState();
          }

          class _ShellState extends State<StudioShell> {
            int _idx = 0;

            Future<void> _openAdmin() async {
              if (AppConfig.isEndUserBuild) { return; }
              if (widget.controller.adminUnlocked) { setState(() => _idx = 3); return; }
              final pc = TextEditingController();
              final ok = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('ورود به بخش مخفی Admin Builder'),
                  content: TextField(controller: pc, obscureText: true, autofocus: true, onSubmitted: (_) => Navigator.pop(ctx, AdminAuth.verifyPassword(pc.text)), decoration: const InputDecoration(labelText: 'رمز عبور', border: OutlineInputBorder())),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('انصراف')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, AdminAuth.verifyPassword(pc.text)), child: const Text('ورود')),
                  ],
                ),
              );
              pc.dispose();
              if (ok == true && mounted) {
                setState(() { widget.controller.adminUnlocked = true; _idx = 3; });
              } else if (ok == false && mounted) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('رمز اشتباه است.')));
              }
            }

            @override
            Widget build(BuildContext context) {
              final c = widget.controller;
              final accent = Color(c.uiCustom.accentArgb);
              final sym = kAxonSymbols[c.uiCustom.symbolId.clamp(0, kAxonSymbols.length - 1)];
              final wide = MediaQuery.sizeOf(context).width >= 860;
              final pages = [
                ChatWorkspaceScreen(controller: c),
                EngineSettingsScreen(controller: c),
                ServerConnectScreen(controller: c),
                if (!AppConfig.isEndUserBuild) AdminBuilderScreen(controller: c),
              ];
              final body = Directionality(
                textDirection: c.isRtl ? TextDirection.rtl : TextDirection.ltr,
                child: Scaffold(
                  appBar: AppBar(
                    backgroundColor: const Color(0xFF0D1119),
                    title: Row(children: [
                      if (c.customBrandIconFile != null)
                        ClipRRect(borderRadius: BorderRadius.circular(6), child: Image.file(c.customBrandIconFile!, width: 24, height: 24, fit: BoxFit.cover))
                      else
                        Icon(sym, color: accent),
                      const SizedBox(width: 8),
                      Expanded(child: Text(c.licenseConfig?.brandName ?? AppConfig.brandName, overflow: TextOverflow.ellipsis)),
                    ]),
                    actions: [
                      TextButton(onPressed: c.toggleLanguage, child: Text(c.isRtl ? 'EN' : 'FA')),
                      if (!AppConfig.isEndUserBuild)
                        IconButton(tooltip: 'Admin Builder', icon: Icon(c.adminUnlocked ? Icons.verified_user : Icons.vpn_key_rounded, color: c.adminUnlocked ? const Color(0xFF1DE9B6) : Colors.white60), onPressed: _openAdmin),
                    ],
                  ),
                  body: Row(children: [
                    if (wide)
                      NavigationRail(
                        backgroundColor: const Color(0xFF0D1119), selectedIndex: _idx.clamp(0, 2), onDestinationSelected: (i) => setState(() => _idx = i),
                        labelType: NavigationRailLabelType.all,
                        destinations: const [
                          NavigationRailDestination(icon: Icon(Icons.chat_bubble_rounded), label: Text('چت')),
                          NavigationRailDestination(icon: Icon(Icons.tune_rounded), label: Text('موتور')),
                          NavigationRailDestination(icon: Icon(Icons.dns_rounded), label: Text('سرور')),
                        ],
                      ),
                    Expanded(child: AnimatedSwitcher(duration: const Duration(milliseconds: 200), child: KeyedSubtree(key: ValueKey(_idx), child: pages[_idx]))),
                  ]),
                  bottomNavigationBar: wide ? null : NavigationBar(
                    selectedIndex: _idx.clamp(0, 2), onDestinationSelected: (i) => setState(() => _idx = i),
                    destinations: const [
                      NavigationDestination(icon: Icon(Icons.chat_bubble_rounded), label: 'چت'),
                      NavigationDestination(icon: Icon(Icons.tune_rounded), label: 'موتور'),
                      NavigationDestination(icon: Icon(Icons.dns_rounded), label: 'سرور'),
                    ],
                  ),
                ),
              );
              if (AppConfig.isEndUserBuild) { return body; }
              return CallbackShortcuts(bindings: {const SingleActivator(LogicalKeyboardKey.keyA, control: true, shift: true): _openAdmin}, child: Focus(autofocus: true, child: body));
            }
          }
          """)

      - name: Rebuild Upgraded End-User Android Template & Master Pro APK (With Working Password)
        working-directory: axon_studio_app
        env:
          RAW_PASS: ${{ github.event.inputs.admin_password || secrets.AXON_ADMIN_PASSWORD || 'mohsen@1390' }}
        run: |
          set -e
          yes | flutter doctor --android-licenses >/dev/null 2>&1 || true
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

          # ۱) بازسازی تمپلیت End-User اندروید با امکانات شخصی‌سازی و .axpkg
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=AXON_ENDUSER_BUILD=true \
            --dart-define=AXON_LICENSE_HMAC_KEY="${{ env.HMAC_KEY }}"
          cp build/app/outputs/flutter-apk/app-release.apk assets/templates/android-enduser.apk

          # ۲) تولید قطتعی هش PBKDF2 رمز در همین Runner (بدون باگ Skip output)
          HASH_OUT=$(dart run tool/gen_admin_hash.dart "$RAW_PASS")
          ADMIN_SALT=$(echo "$HASH_OUT" | grep AXON_ADMIN_SALT | cut -d= -f2)
          ADMIN_PBKDF2=$(echo "$HASH_OUT" | grep AXON_ADMIN_PBKDF2 | cut -d= -f2)
          echo "Checking Admin PBKDF2 hash lengths: salt=${#ADMIN_SALT}, hash=${#ADMIN_PBKDF2}"
          test "${#ADMIN_SALT}" -eq 32
          test "${#ADMIN_PBKDF2}" -eq 64

          # ۳) جاسازی تمام تمپلیت‌ها و ساخت APK نهایی Master Pro
          rm -f assets/templates/placeholder.txt
          grep -q "assets/templates/" pubspec.yaml || printf "    - assets/templates/\n" >> pubspec.yaml
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=AXON_ENDUSER_BUILD=false \
            --dart-define=AXON_LICENSE_HMAC_KEY="${{ env.HMAC_KEY }}" \
            --dart-define=AXON_ADMIN_SALT="$ADMIN_SALT" \
            --dart-define=AXON_ADMIN_PBKDF2="$ADMIN_PBKDF2"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AxonStudio-Pro-Master-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AxonStudio-Pro-Master-android
          path: axon_studio_app/dist/AxonStudio-Pro-Master-arm64.apk
